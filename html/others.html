<!DOCTYPE html>

<head>
    <html lang="zh-TW">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">

    <title>條款 | 高林的個人網頁</title>

    <script src="../script/loader.js"></script>
    <link rel="stylesheet" href="../style/loader.css">
    <link rel="icon" type="image/x-icon" href="../assets/webicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Noto+Serif+TC&display=swap" rel="stylesheet">


    <style>
        html {
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f0e6;
            font-family: 'Noto Serif TC', serif;
            color: #3e2f1c;
            font-size: 1.1rem;
            line-height: 1.8;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
        }

        header {
            text-align: center;
            padding: 2rem 1rem;
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            border-bottom: 2px solid #d4c2a6;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .card {
            background: #fffaf3;
            border: 2px solid #d4c2a6;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(100, 80, 50, 0.2);
            width: 80%;
            max-width: 640px;
            margin: 1rem 0;
            padding: 1.8rem;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 12px rgba(100, 80, 50, 0.3);
        }

        .card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .card p {
            font-size: 1.4rem;
        }

        .home-link {
            margin-top: 2rem;
            text-align: center;
        }

        .home-link a {
            text-decoration: none;
            color: #6b4f2c;
            font-weight: bold;
            border: 1px solid #d4c2a6;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            background-color: #fdf6e9;
            font-size: 1.4rem;
            transition: background-color 0.3s ease;
        }

        .home-link a:hover {
            background-color: #f0e4d0;
        }

        /* 📱 響應式設計 */
        @media (max-width: 480px) {
            header {
                font-size: 1.8rem;
            }

            .card {
                padding: 1.2rem;
            }

            .card h2 {
                font-size: 1.4rem;
            }

            .card p,
            .home-link a {
                font-size: 1rem;
            }
        }

        a {
            text-decoration: none;
            color: #3e2f1c;
        }

        .card:hover {
            background-color: #f0e4d0;
        }

        .wrapper {
            overflow: scroll;
            height: 100dvh;
            width: 100dvw;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .wrapper::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div id="loading-screen">
            <div class="loader"></div>
        </div>

        <header>條款與政策</header>

        <div class="container">
            <div class="card">
                <a href="privacy_policy.html">
                    <h2>隱私條款</h2>
                    <p>我們重視您的個人資料保護，所有資訊僅用於提升使用體驗，不會任意分享給第三方。</p>
                </a>
            </div>
            <div class="card">
                <a href="terms_of_service.html">
                    <h2>服務條款</h2>
                    <p>使用本網站即表示您同意遵守相關規範，包括但不限於內容使用、互動行為與資料安全。</p>
                </a>
            </div>
            <div class="home-link">
                <a href="../index.html">回首頁</a>
            </div>
        </div>
    </div>
</body>

</html>
