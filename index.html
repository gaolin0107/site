<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#222222">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>計時器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .hidden-force {
            display: none !important;
        }

        input:focus {
            outline: none;
        }

        :root {
            --cream: #FEFAEF;
            --dark: #222222;
            --grey: #A3A3A3;
        }

        .text-cream {
            color: var(--cream);
        }

        .bg-cream {
            background-color: var(--cream);
        }

        .text-dark {
            color: var(--dark);
        }

        .bg-dark {
            background-color: var(--dark);
        }

        .btn-hover {
            transition: all 0.2s ease;
        }

        .btn-hover:hover {
            transform: scale(1.1);
            background-color: #ffffff;
        }

        .btn-hover:active {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .modal-btn:active {
            transform: scale(0.95);
        }

        .preset-btn {
            border: 1px solid #A3A3A3;
            color: #A3A3A3;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            border-color: #222222;
            color: #222222;
            background-color: rgba(34, 34, 34, 0.05);
        }

        /* 功能按鈕 (小時/歸零) */
        .func-btn {
            background-color: rgba(34, 34, 34, 0.05);
            color: #555;
            font-weight: 600;
            transition: all 0.2s;
        }

        .func-btn:hover {
            background-color: #222222;
            color: #FEFAEF;
        }

        .func-btn.active {
            background-color: #222222;
            color: #FEFAEF;
        }

        .mode-switch-container {
            background-color: rgba(254, 250, 239, 0.1);
            border-radius: 9999px;
            padding: 4px;
            display: flex;
            gap: 4px;
        }

        .mode-btn {
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(254, 250, 239, 0.5);
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background-color: var(--cream);
            color: var(--dark);
            font-weight: 700;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #222222;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 0 0 4px #FEFAEF;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #222222;
            border-radius: 2px;
        }

        input[type=range]:focus {
            outline: none;
        }

        #timer-container {
            transition: transform 0.3s ease-in-out;
        }

        .edit-mode-active #timer-container {
            transform: translateY(-20vh);
        }

        #progress-bar {
            transition: width 1s linear;
        }

        #progress-bar.hidden-bar {
            opacity: 0;
            width: 0 !important;
            transition: opacity 0.3s, width 0s 0.3s;
        }
    </style>
</head>

<body
    class="min-h-screen bg-[#222222] text-[#FEFAEF] flex flex-col items-center justify-center relative font-sans selection:bg-orange-500/30 overflow-hidden">

    <div class="absolute top-0 left-0 w-full h-1 bg-[#222222] z-50">
        <div id="progress-bar" class="h-full bg-cream w-full"></div>
    </div>

    <div id="top-bar"
        class="absolute top-0 left-0 w-full p-4 md:p-8 flex justify-between items-center z-10 transition-opacity duration-300">
        <button onclick="goHome()"
            class="w-12 h-12 rounded-full bg-cream text-dark flex items-center justify-center btn-hover shadow-lg"
            title="回首頁">
            <i data-lucide="home" width="24" height="24"></i>
        </button>


        <div class="mode-switch-container">
            <button onclick="switchAppMode('timer')" id="btn-mode-timer" class="mode-btn active">計時器</button>
            <button onclick="switchAppMode('stopwatch')" id="btn-mode-stopwatch" class="mode-btn">碼錶</button>
        </div>

        <button onclick="toggleFullscreen()" id="fullscreen-btn"
            class="w-12 h-12 rounded-full bg-cream text-dark flex items-center justify-center btn-hover shadow-lg"
            title="全螢幕 (Esc退出)">
            <i data-lucide="maximize" width="24" height="24" id="icon-maximize"></i>
            <i data-lucide="minimize" width="24" height="24" id="icon-minimize" class="hidden-force"></i>
        </button>
    </div>

    <div class="flex flex-col items-center gap-6 md:gap-12 w-full max-w-2xl px-4">

        <div id="timer-container" class="relative group cursor-default w-full flex justify-center">
            <h1 id="timer-display"
                class="font-bold tracking-tight text-cream leading-none tabular-nums font-sans whitespace-nowrap">
                59:59
            </h1>
            <div id="timer-status"
                class="absolute -bottom-6 left-1/2 -translate-x-1/2 text-sm font-medium tracking-widest uppercase opacity-0 transition-opacity duration-300 whitespace-nowrap">

            </div>
        </div>

        <div id="controls-view" class="flex items-center gap-6 animate-in fade-in zoom-in duration-300">

            <button onclick="resetTimer()"
                class="w-14 h-14 rounded-full bg-cream text-dark flex items-center justify-center btn-hover shadow-xl"
                title="重置">
                <i data-lucide="rotate-ccw" width="24" height="24"></i>
            </button>

            <button id="play-pause-btn" onclick="toggleTimer()"
                class="w-14 h-14 rounded-full bg-cream text-dark flex items-center justify-center btn-hover shadow-xl disabled:opacity-50 disabled:cursor-not-allowed"
                title="開始/暫停 (Space)">
                <span id="play-icon-wrapper" class="flex items-center justify-center">
                    <i data-lucide="play" width="24" height="24" class="fill-current ml-0.5"></i>
                </span>
                <span id="pause-icon-wrapper" class="hidden-force flex items-center justify-center">
                    <i data-lucide="pause" width="24" height="24" class="fill-current"></i>
                </span>
            </button>

            <button onclick="openEditMode()"
                class="w-14 h-14 rounded-full bg-cream text-dark flex items-center justify-center btn-hover shadow-xl"
                title="設定">
                <i data-lucide="pencil" width="24" height="24"></i>
            </button>
        </div>

        <form id="edit-view"
            class="hidden-force fixed bottom-0 left-0 w-full h-auto min-h-[50vh] bg-[#FEFAEF] rounded-t-[2rem] md:rounded-t-[3rem] shadow-[0_-10px_40px_rgba(0,0,0,0.5)] z-50 p-6 md:p-8 pb-10 flex flex-col items-center justify-between gap-6 animate-in slide-in-from-bottom duration-300">

            <h2 id="modal-title"
                class="absolute top-8 left-1/2 -translate-x-1/2 text-[#222222] text-xl font-bold tracking-wide">設定時間
            </h2>

            <div class="absolute top-6 left-6">
                <button type="button" id="tab-btn-time" onclick="switchTab('time')"
                    class="w-10 h-10 rounded-full bg-[#222222] text-white flex items-center justify-center transition-transform active:scale-95 hover:bg-neutral-800">
                    <i data-lucide="clock" width="20" height="20"></i>
                </button>
            </div>
            <div class="absolute top-6 right-6">
                <button type="button" id="tab-btn-font" onclick="switchTab('font')"
                    class="w-10 h-10 rounded-full bg-[#222222] text-white flex items-center justify-center transition-transform active:scale-95 hover:bg-neutral-800">
                    <i data-lucide="type" width="20" height="20"></i>
                </button>
            </div>

            <div class="flex-1 w-full flex items-center justify-center mt-12">

                <div id="section-time" class="flex flex-col items-center gap-6 w-full transition-opacity duration-300">

                    <div id="time-inputs-container"
                        class="flex items-center justify-center gap-2 md:gap-4 text-7xl md:text-8xl font-bold transition-all duration-300">

                        <div id="hour-group" class="hidden-force flex items-center gap-2 md:gap-4">
                            <div class="relative group">
                                <input id="hour-input" type="text" inputmode="numeric" placeholder="00"
                                    class="w-24 md:w-32 bg-transparent border-b-[6px] border-[#A3A3A3]/50 focus:border-[#222222] outline-none text-center placeholder:text-[#A3A3A3] pb-2 transition-colors font-sans text-[#A3A3A3]" />
                            </div>
                            <span class="text-[#A3A3A3] pb-4">:</span>
                        </div>

                        <div class="relative group">
                            <input id="min-input" type="text" inputmode="numeric" placeholder="00"
                                class="w-32 md:w-40 bg-transparent border-b-[6px] border-[#A3A3A3]/50 focus:border-[#222222] outline-none text-center placeholder:text-[#A3A3A3] pb-2 transition-colors font-sans text-[#A3A3A3]" />
                        </div>
                        <span id="time-colon" class="text-[#A3A3A3] pb-4 transition-colors">:</span>
                        <div class="relative group">
                            <input id="sec-input" type="text" inputmode="numeric" placeholder="00"
                                class="w-32 md:w-40 bg-transparent border-b-[6px] border-[#A3A3A3]/50 focus:border-[#222222] outline-none text-center placeholder:text-[#A3A3A3] pb-2 transition-colors font-sans text-[#A3A3A3]" />
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button type="button" onclick="resetInputs()" class="func-btn px-4 py-2 rounded-full text-sm">
                            歸零
                        </button>
                        <button type="button" id="btn-toggle-hour" onclick="toggleHourInput()"
                            class="func-btn px-4 py-2 rounded-full text-sm">
                            小時
                        </button>
                    </div>

                    <div class="flex gap-2 md:gap-3 flex-wrap justify-center mt-1">
                        <button type="button" onclick="quickSetTime(5)"
                            class="preset-btn px-5 py-2.5 md:px-6 md:py-3 rounded-full text-sm md:text-base font-medium">5分</button>
                        <button type="button" onclick="quickSetTime(10)"
                            class="preset-btn px-5 py-2.5 md:px-6 md:py-3 rounded-full text-sm md:text-base font-medium">10分</button>
                        <button type="button" onclick="quickSetTime(30)"
                            class="preset-btn px-5 py-2.5 md:px-6 md:py-3 rounded-full text-sm md:text-base font-medium">30分</button>
                        <button type="button" onclick="quickSetTime(60)"
                            class="preset-btn px-5 py-2.5 md:px-6 md:py-3 rounded-full text-sm md:text-base font-medium">1小時</button>
                    </div>

                </div>

                <div id="section-font"
                    class="hidden-force flex flex-col items-center justify-center gap-6 w-full px-4 md:px-8 transition-opacity duration-300">
                    <div class="text-[#222222] text-2xl font-bold tracking-tight font-sans" id="font-size-display">160px
                    </div>
                    <div class="w-full relative py-4 max-w-md">
                        <input type="range" id="font-slider" min="20" max="600" value="160" step="5" class="w-full">
                    </div>
                </div>

            </div>

            <div class="flex items-center gap-8 mb-2">
                <button type="button" onclick="closeEditMode()"
                    class="w-20 h-12 md:w-24 md:h-14 rounded-full bg-[#222222] hover:bg-neutral-800 text-white transition-colors flex items-center justify-center modal-btn shadow-lg">
                    <i data-lucide="x" width="24" height="24"></i>
                </button>

                <button type="submit" id="confirm-btn"
                    class="w-20 h-12 md:w-24 md:h-14 rounded-full bg-[#222222] hover:bg-neutral-800 text-white transition-colors flex items-center justify-center modal-btn shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="check" width="24" height="24"></i>
                </button>
            </div>
        </form>

    </div>

    <script>
        lucide.createIcons();

        let appMode = 'timer';
        let initialTime = 3599;
        let timeLeft = 3599;
        let isTimerActive = false;
        let timerInterval = null;

        let stopwatchTime = 0;
        let initialStopwatchTime = 0;
        let isStopwatchActive = false;
        let stopwatchInterval = null;
        let lastStopwatchTime = 0;
        let stopwatchHasHours = false;

        const MAX_TIME_SECONDS = 99 * 3600 + 59 * 60 + 59;
        const MAX_TIME_MS = MAX_TIME_SECONDS * 1000;

        let currentEditMode = 'time';
        let currentFontSize = 160;
        let showHoursInput = false;

        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playAlarmSound() {
            initAudio();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);

            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);
                gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.5);
            }, 600);
        }

        const body = document.body;
        const topBar = document.getElementById('top-bar');
        const timerDisplay = document.getElementById('timer-display');
        const timerStatus = document.getElementById('timer-status');
        const progressBar = document.getElementById('progress-bar');

        const playBtn = document.getElementById('play-pause-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const iconMaximize = document.getElementById('icon-maximize');
        const iconMinimize = document.getElementById('icon-minimize');

        const playWrapper = document.getElementById('play-icon-wrapper');
        const pauseWrapper = document.getElementById('pause-icon-wrapper');

        const controlsView = document.getElementById('controls-view');
        const editView = document.getElementById('edit-view');

        const hourInput = document.getElementById('hour-input');
        const minInput = document.getElementById('min-input');
        const secInput = document.getElementById('sec-input');
        const hourGroup = document.getElementById('hour-group');
        const timeInputsContainer = document.getElementById('time-inputs-container');
        const btnToggleHour = document.getElementById('btn-toggle-hour');

        const timeColon = document.getElementById('time-colon');
        const confirmBtn = document.getElementById('confirm-btn');
        const modalTitle = document.getElementById('modal-title');

        const sectionTime = document.getElementById('section-time');
        const sectionFont = document.getElementById('section-font');
        const fontSlider = document.getElementById('font-slider');
        const fontSizeDisplay = document.getElementById('font-size-display');
        const tabBtnTime = document.getElementById('tab-btn-time');
        const tabBtnFont = document.getElementById('tab-btn-font');


        function getSafeFontSize(requestedSize, textContent) {
            const windowHeight = window.innerHeight;
            const windowWidth = window.innerWidth;

            const reservedHeight = 280;
            const maxSafeHeight = windowHeight - reservedHeight;

            const charCount = textContent ? textContent.length : 5;
            const widthRatio = charCount > 6 ? 5.5 : 3.5;

            const paddingX = 40;
            const maxSafeWidth = (windowWidth - paddingX) / widthRatio;

            let finalRequested = requestedSize;

            const safeSize = Math.floor(Math.min(finalRequested, Math.max(20, maxSafeHeight), maxSafeWidth));

            return safeSize;
        }

        function formatTimerTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;

            if (h > 0) {
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function formatStopwatchTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const h = Math.floor(totalSeconds / 3600);

            if (h > 0) {
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = totalSeconds % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            } else {
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                const centiseconds = Math.floor((ms % 1000) / 10);
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
            }
        }

        function updateDisplay() {
            let timeString = "";
            let isActive = false;

            if (appMode === 'timer') {
                timeString = formatTimerTime(timeLeft);
                isActive = isTimerActive;

                const progress = initialTime > 0 ? (timeLeft / initialTime) * 100 : 0;
                progressBar.style.width = `${progress}%`;
                progressBar.classList.remove('hidden-bar');

            } else {
                timeString = formatStopwatchTime(stopwatchTime);
                isActive = isStopwatchActive;

                progressBar.classList.add('hidden-bar');
            }

            timerDisplay.textContent = timeString;
            document.title = isActive ? `(${timeString}) 計時器` : '計時器';

            const safeSize = getSafeFontSize(currentFontSize, timeString);
            timerDisplay.style.fontSize = `${safeSize}px`;

            if (isActive) {
                timerStatus.classList.remove('opacity-100');
                timerStatus.classList.add('opacity-0');
                playWrapper.classList.add('hidden-force');
                pauseWrapper.classList.remove('hidden-force');
                playBtn.disabled = false;
            } else {
                playWrapper.classList.remove('hidden-force');
                pauseWrapper.classList.add('hidden-force');

                if (appMode === 'timer') {
                    timerStatus.textContent = "";
                } else {
                    if (stopwatchTime >= MAX_TIME_MS) {
                        timerStatus.textContent = "已達上限";
                        playBtn.disabled = true;
                    } else {
                        timerStatus.textContent = "碼錶已暫停";
                        playBtn.disabled = false;
                    }
                }
                timerStatus.classList.remove('opacity-0');
                timerStatus.classList.add('opacity-100');
            }
        }

        window.addEventListener('resize', updateDisplay);

        function switchAppMode(mode) {
            if (mode === appMode) return;

            if (isTimerActive) toggleTimer();
            if (isStopwatchActive) toggleTimer();

            appMode = mode;

            document.getElementById('btn-mode-timer').classList.toggle('active', mode === 'timer');
            document.getElementById('btn-mode-stopwatch').classList.toggle('active', mode === 'stopwatch');

            playBtn.disabled = false;
            updateDisplay();
        }

        function toggleTimer() {
            initAudio();

            if (appMode === 'timer') {
                if (timeLeft === 0 && !isTimerActive) return;

                isTimerActive = !isTimerActive;
                updateDisplay();

                if (isTimerActive) {
                    timerInterval = setInterval(() => {
                        if (timeLeft > 0) {
                            timeLeft--;
                            updateDisplay();
                        } else {
                            isTimerActive = false;
                            clearInterval(timerInterval);
                            updateDisplay();
                            playAlarmSound();
                        }
                    }, 1000);
                } else {
                    clearInterval(timerInterval);
                }
            } else {
                if (stopwatchTime >= MAX_TIME_MS) return;

                isStopwatchActive = !isStopwatchActive;

                if (isStopwatchActive) {
                    lastStopwatchTime = Date.now();
                    stopwatchInterval = setInterval(() => {
                        const now = Date.now();
                        const delta = now - lastStopwatchTime;
                        lastStopwatchTime = now;
                        stopwatchTime += delta;

                        if (stopwatchTime >= MAX_TIME_MS) {
                            stopwatchTime = MAX_TIME_MS;
                            isStopwatchActive = false;
                            clearInterval(stopwatchInterval);
                            playAlarmSound();
                        }

                        updateDisplay();
                    }, 10);
                } else {
                    clearInterval(stopwatchInterval);
                }
                updateDisplay();
            }
        }

        function resetTimer() {
            if (appMode === 'timer') {
                isTimerActive = false;
                clearInterval(timerInterval);
                timeLeft = initialTime;
            } else {
                isStopwatchActive = false;
                clearInterval(stopwatchInterval);
                stopwatchTime = initialStopwatchTime;
            }
            playBtn.disabled = false;
            updateDisplay();
        }


        function quickSetTime(minutes) {
            let h = 0, m = 0, s = 0;

            let totalSeconds = minutes * 60;

            h = Math.floor(totalSeconds / 3600);
            m = Math.floor((totalSeconds % 3600) / 60);
            s = totalSeconds % 60;

            if (h > 0 && !showHoursInput) {
                toggleHourInput();
            }

            hourInput.value = h > 0 ? h.toString().padStart(2, '0') : (showHoursInput ? "00" : "");
            minInput.value = m.toString().padStart(2, '0');
            secInput.value = s.toString().padStart(2, '0');

            updateInputColors();
            checkInputs();
            updatePreview();
        }

        function toggleHourInput() {
            showHoursInput = !showHoursInput;
            if (showHoursInput) {
                hourGroup.classList.remove('hidden-force');
                hourGroup.classList.add('flex');
                btnToggleHour.classList.add('active');

                timeInputsContainer.classList.remove('text-7xl', 'md:text-8xl');
                timeInputsContainer.classList.add('text-5xl', 'md:text-6xl');

                hourInput.value = "";
            } else {
                hourGroup.classList.add('hidden-force');
                hourGroup.classList.remove('flex');
                btnToggleHour.classList.remove('active');

                timeInputsContainer.classList.add('text-7xl', 'md:text-8xl');
                timeInputsContainer.classList.remove('text-5xl', 'md:text-6xl');

                hourInput.value = "";
            }
            updateInputColors();
            updatePreview();
        }

        function resetInputs() {
            hourInput.value = "";
            minInput.value = "";
            secInput.value = "";
            updateInputColors();
            checkInputs();
            updatePreview();
        }

        function updatePreview() {
            if (editView.classList.contains('hidden-force')) return;

            let h = hourInput.value || "00";
            let m = minInput.value || "00";
            let s = secInput.value || "00";

            h = parseInt(h).toString().padStart(2, '0');
            m = parseInt(m).toString().padStart(2, '0');
            s = parseInt(s).toString().padStart(2, '0');

            let previewString = "";
            if (showHoursInput || parseInt(h) > 0) {
                previewString = `${h}:${m}:${s}`;
            } else {
                previewString = `${m}:${s}`;
            }

            timerDisplay.textContent = previewString;

            const requestedSize = parseInt(fontSlider.value);
            const safeSize = getSafeFontSize(requestedSize, previewString);

            if (requestedSize > safeSize) {
                fontSlider.value = safeSize;
                fontSizeDisplay.textContent = `${safeSize}px`;
            }
            timerDisplay.style.fontSize = `${safeSize}px`;
        }

        function updateFullscreenIcon() {
            if (document.fullscreenElement) {
                iconMaximize.classList.add('hidden-force');
                iconMinimize.classList.remove('hidden-force');
                fullscreenBtn.title = "退出全螢幕";
            } else {
                iconMaximize.classList.remove('hidden-force');
                iconMinimize.classList.add('hidden-force');
                fullscreenBtn.title = "全螢幕 (Esc退出)";
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener('fullscreenchange', updateFullscreenIcon);

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                toggleTimer();
            }
            if (e.code === 'Escape') {
                if (!editView.classList.contains('hidden-force')) {
                    closeEditMode();
                }
            }
        });


        function openEditMode() {
            if (isTimerActive || isStopwatchActive) toggleTimer();

            topBar.classList.add('hidden-force');
            controlsView.classList.add('hidden-force');
            editView.classList.remove('hidden-force');
            body.classList.add('edit-mode-active');

            fontSlider.value = currentFontSize;
            fontSizeDisplay.textContent = `${currentFontSize}px`;

            tabBtnTime.classList.remove('hidden-force');
            tabBtnTime.style.display = 'flex';
            tabBtnFont.classList.remove('hidden-force');
            tabBtnFont.style.display = 'flex';

            switchTab('time');

            hourInput.value = "";
            minInput.value = "";
            secInput.value = "";

            if (showHoursInput) {
                toggleHourInput();
            }

            updateInputColors();
            checkInputs();
            updatePreview();
        }

        function closeEditMode() {
            topBar.classList.remove('hidden-force');
            controlsView.classList.remove('hidden-force');
            editView.classList.add('hidden-force');
            body.classList.remove('edit-mode-active');

            updateDisplay();
        }

        function switchTab(mode) {
            currentEditMode = mode;
            if (mode === 'time') {
                modalTitle.textContent = "設定時間";
                sectionTime.classList.remove('hidden-force');
                sectionFont.classList.add('hidden-force');
                checkInputs();
            } else {
                modalTitle.textContent = "文字大小";
                sectionTime.classList.add('hidden-force');
                sectionFont.classList.remove('hidden-force');
                confirmBtn.disabled = false;
            }
        }

        function checkInputs() {
            if (currentEditMode === 'time') {
                const h = hourInput.value;
                const m = minInput.value;
                const s = secInput.value;
                confirmBtn.disabled = !(m || s || h);
            } else {
                confirmBtn.disabled = false;
            }
        }

        function updateInputColors() {
            const styleInput = (el) => {
                if (el.value.length > 0) {
                    el.classList.remove('text-[#A3A3A3]', 'border-[#A3A3A3]/50');
                    el.classList.add('text-[#222222]', 'border-[#222222]');
                } else {
                    el.classList.add('text-[#A3A3A3]', 'border-[#A3A3A3]/50');
                    el.classList.remove('text-[#222222]', 'border-[#222222]');
                }
            };

            styleInput(hourInput);
            styleInput(minInput);
            styleInput(secInput);

            if (minInput.value.length > 0 || hourInput.value.length > 0) {
                timeColon.classList.remove('text-[#A3A3A3]');
                timeColon.classList.add('text-[#222222]');
            } else {
                timeColon.classList.add('text-[#A3A3A3]');
                timeColon.classList.remove('text-[#222222]');
            }
        }

        function submitEdit(e) {
            if (e) e.preventDefault();

            if (currentEditMode === 'time') {
                let h = parseInt(hourInput.value) || 0;
                let m = parseInt(minInput.value) || 0;
                let s = parseInt(secInput.value) || 0;

                let totalSecs = (h * 3600) + (Math.min(m, 99) * 60) + Math.min(s, 59);

                if (totalSecs > MAX_TIME_SECONDS) {
                    totalSecs = MAX_TIME_SECONDS;
                }

                if (totalSecs >= 0) {
                    if (appMode === 'timer') {
                        initialTime = totalSecs;
                        timeLeft = totalSecs;
                    } else {
                        initialStopwatchTime = totalSecs * 1000;
                        stopwatchTime = initialStopwatchTime;
                        stopwatchHasHours = (h > 0 || showHoursInput);
                    }
                }
            }

            currentFontSize = parseInt(fontSlider.value);

            playBtn.disabled = false;
            updateDisplay();
            closeEditMode();
        }


        function handleInput(e) {
            let val = e.target.value;
            val = val.replace(/\D/g, '');
            if (val.length > 2) {
                val = val.slice(-1);
            }
            e.target.value = val;
            updateInputColors();
            checkInputs();
            updatePreview();
        }

        function handleKeyDown(e, type) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (type === 'hours') {
                    minInput.focus();
                } else if (type === 'minutes') {
                    secInput.focus();
                } else if (type === 'seconds') {
                    submitEdit();
                }
            }
        }

        fontSlider.addEventListener('input', (e) => {
            let requestedSize = parseInt(e.target.value);
            // 追蹤高林ig:gaolin_0107
            const currentString = timerDisplay.textContent;
            const safeSize = getSafeFontSize(requestedSize, currentString);

            if (requestedSize > safeSize) {
                e.target.value = safeSize;
                requestedSize = safeSize;
            }

            fontSizeDisplay.textContent = `${requestedSize}px`;
            timerDisplay.style.fontSize = `${requestedSize}px`;
        });

        hourInput.addEventListener('input', handleInput);
        minInput.addEventListener('input', handleInput);
        secInput.addEventListener('input', handleInput);

        hourInput.addEventListener('keydown', (e) => handleKeyDown(e, 'hours'));
        minInput.addEventListener('keydown', (e) => handleKeyDown(e, 'minutes'));
        secInput.addEventListener('keydown', (e) => handleKeyDown(e, 'seconds'));

        editView.addEventListener('submit', submitEdit);

        function goHome() {
            console.log("Navigating Home");
            location.href = "../index.html";
        }

        updateDisplay();
    </script>
    <div
        class="absolute bottom-4 w-full text-center text-[10px] text-[#FEFAEF] opacity-30 select-none pointer-events-none font-sans tracking-widest z-0">
        &copy; <span id="year-display">Loading...</span> Gaolin
    </div>

    <script>
        (async function initCopyrightYear() {
            const display = document.getElementById('year-display');

            const localYear = new Date().getFullYear();
            display.textContent = localYear;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);

                const response = await fetch('https://worldtimeapi.org/api/timezone/Asia/Taipei', {
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    const networkYear = data.datetime.substring(0, 4);

                    display.textContent = networkYear;
                    console.log('已校正為網路時間:', networkYear);
                }
            } catch (error) {
                console.log('網路校時失敗，維持系統時間');
            }
        })();
    </script>
