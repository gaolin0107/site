<!DOCTYPE html>

<head>
    <html lang="zh-TW">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">

    <title>條款 | 高林的個人網頁</title>

    <script src="../script/loader.js"></script>
    <link rel="stylesheet" href="../style/loader.css">
    <link rel="icon" type="image/x-icon" href="../assets/logo/webicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Noto+Serif+TC&display=swap"
        rel="stylesheet">


    <style>
        :root {
            /* Palette */
            --parchment: #F5EFE6;
            --ochre: #CDA46A;
            --terracotta: #B16A5B;
            --forest: #2F4F4F;
            --charcoal: #2B2B2B;
            --garnet: #7A2E2E;

            /* Layering & shadow */


            --font-sans: "Inter", "Noto Sans TC", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-sans);
            color: var(--charcoal);
            background: var(--parchment);
            line-height: 1.65;
            text-rendering: optimizeLegibility;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {

            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
        }

        header {
            padding: 2rem 1rem;
        }

        .navbar {
            position: relative;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: center;
            /* 水平置中 */
            padding: 18px 5%;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            border-radius: 0 0 20px 20px;
            font-size: clamp(26px, 2.9dvw, 34px);
            /* 字體稍微縮小 */
            font-family: 'Noto Serif TC';
            font-weight: 700;
            /* 加粗字體 */
            color: var(--charcoal);

            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3),
                0 2px 8px rgba(43, 43, 43, 0.05);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 水平置中 */
            justify-content: center;
            /* 垂直置中 */
            height: 90dvh;
            /* 讓容器高度等於整個視窗 */
            padding: 1rem;
        }


        .card {
            background: #fffaf3;
            border-radius: 25px;
            box-shadow: 0 8px 8px rgba(100, 80, 50, 0.18);
            width: 80%;
            max-width: 640px;
            margin: 1rem 0;
            padding: 0 1.8rem 0 1.8rem;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 12px rgba(100, 80, 50, 0.3);
            background: rgba(205, 164, 106, 0.1);
        }

        .card h2 {
            font-family: 'Noto Serif TC';
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .card p {
            font-size: 1.2rem;
        }

        .home-link {
            margin-top: 2rem;
            text-align: center;
        }

        .home-link a {
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #d4c2a6;
            padding: 0.6rem 1.2rem;
            border-radius: 14px;
            font-size: 1.2rem;
            background: #fffaf3;
            transition: background-color 0.3s ease;
        }

        .home-link a:hover {
            background: rgba(205, 164, 106, 0.1);
        }



        a {
            text-decoration: none;
            color: #3e2f1c;
        }


        .wrapper {
            overflow: scroll;
            height: 100dvh;
            width: 100dvw;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .wrapper::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div id="loading-screen">
            <div class="loader"></div>
        </div>

        <header class="navbar">
            <nav class="nav">條款與政策</mav>
        </header>

        <div class="container">
            <div class="card">
                <a href="privacy_policy.html">
                    <h2>隱私條款</h2>
                    <p>我們重視您的個人資料保護，所有資訊僅用於提升使用體驗，不會任意分享給第三方。</p>
                </a>
            </div>
            <div class="card">
                <a href="terms_of_service.html">
                    <h2>服務條款</h2>
                    <p>使用本網站即表示您同意遵守相關規範，包括但不限於內容使用、互動行為與資料安全。</p>
                </a>
            </div>
            <div class="home-link">
                <a href="../index.html">回首頁</a>
            </div>
        </div>
    </div>
</body>

</html>
