<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 設定瀏覽器網址列顏色為純黑 -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>計時器</title>
    <!-- 引入 Noto Sans 與 Noto Serif 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Serif:wght@400;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .hidden-force {
            display: none !important;
        }

        input:focus {
            outline: none;
        }

        /* 極簡變數與字體統一 */
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --muted-color: #666666;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Noto Sans', system-ui, -apple-system, sans-serif;
        }

        /* 統一按鈕樣式：移除所有背景、陰影，僅保留縮放與透明度變化 */
        button {
            background: transparent;
            border: none;
            box-shadow: none;
            color: inherit;
            transition: all 0.2s ease;
            cursor: pointer;
            padding: 8px;
        }

        button:hover {
            opacity: 0.7;
            transform: scale(1.1);
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.2 !important;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 頂部模式切換 */
        .mode-switch-container {
            display: flex;
            gap: 16px;
        }

        .mode-btn {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-color);
            opacity: 0.4;
            transition: all 0.3s ease;
            padding: 4px 8px;
        }

        .mode-btn.active {
            opacity: 1;
            font-weight: 700;
        }

        /* 藥丸狀設定按鈕統一樣式 (字體與時間設定共用) */
        .setting-pill-btn {
            border: 2px solid transparent;
            padding: 8px 24px;
            border-radius: 9999px;
            transition: all 0.3s;
            font-size: 15px;
            color: #666666;
        }

        .setting-pill-btn:hover {
            color: #000000;
        }

        .setting-pill-btn.active {
            border-color: #000000;
            color: #000000;
            font-weight: 700;
        }

        /* 自定義 Range Slider (優化軌道顏色與長度) */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #000000;
            cursor: pointer;
            margin-top: -10px;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #E5E5E5;
            /* 改為更柔和的淺灰色 */
            border-radius: 2px;
        }

        input[type=range]:focus {
            outline: none;
        }

        #timer-container {
            transition: transform 0.3s ease-in-out;
        }

        .edit-mode-active #timer-container {
            transform: translateY(-15vh);
        }

        #progress-bar {
            transition: width 1s linear;
        }

        #progress-bar.hidden-bar {
            opacity: 0;
            width: 0 !important;
            transition: opacity 0.3s, width 0s 0.3s;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center relative selection:bg-gray-700 overflow-hidden">

    <!-- 頂部進度條 -->
    <div class="fixed top-0 left-0 w-full h-1 bg-[#222222] z-50">
        <div id="progress-bar" class="h-full bg-[#ffffff] w-full"></div>
    </div>

    <!-- 頂部列：首頁、模式切換、全螢幕 -->
    <div id="top-bar"
        class="fixed top-0 left-0 w-full p-6 flex justify-between items-center z-40 transition-opacity duration-300">
        <button onclick="goHome()" title="回首頁">
            <i data-lucide="home" width="28" height="28"></i>
        </button>

        <div class="mode-switch-container">
            <button onclick="switchAppMode('timer')" id="btn-mode-timer" class="mode-btn active">計時器</button>
            <button onclick="switchAppMode('stopwatch')" id="btn-mode-stopwatch" class="mode-btn">碼錶</button>
        </div>

        <button onclick="toggleFullscreen()" id="fullscreen-btn" title="全螢幕 (Esc退出)">
            <i data-lucide="maximize" width="28" height="28" id="icon-maximize"></i>
            <i data-lucide="minimize" width="28" height="28" id="icon-minimize" class="hidden-force"></i>
        </button>
    </div>

    <!-- 時間顯示區塊 -->
    <div
        class="flex flex-col items-center justify-center w-full h-screen px-4 z-0 absolute top-0 left-0 pointer-events-none">
        <div id="timer-container" class="relative flex items-center justify-center pointer-events-auto">

            <!-- 狀態文字 -->
            <div id="timer-status"
                class="absolute bottom-full mb-4 left-1/2 -translate-x-1/2 text-sm font-medium tracking-widest text-[#888888] uppercase opacity-0 transition-opacity duration-300 whitespace-nowrap min-h-[20px]">
            </div>

            <!-- 時間數字 -->
            <h1 id="timer-display" class="tracking-wide leading-none tabular-nums whitespace-nowrap text-center"
                style="font-family: 'Noto Sans', sans-serif; font-weight: 700;">
                Loading...
            </h1>

        </div>
    </div>

    <!-- 底部控制列 -->
    <div id="controls-view"
        class="fixed bottom-[80px] left-0 w-full flex justify-center items-center gap-16 z-20 animate-in fade-in duration-300">
        <button onclick="resetTimer()" title="重置">
            <i data-lucide="rotate-ccw" width="36" height="36"></i>
        </button>

        <button id="play-pause-btn" onclick="toggleTimer()" title="開始/暫停 (Space)">
            <span id="play-icon-wrapper" class="flex items-center justify-center">
                <i data-lucide="play" width="56" height="56" class="fill-current"></i>
            </span>
            <span id="pause-icon-wrapper" class="hidden-force flex items-center justify-center">
                <i data-lucide="pause" width="56" height="56" class="fill-current"></i>
            </span>
        </button>

        <button onclick="openEditMode()" title="設定">
            <i data-lucide="pencil" width="36" height="36"></i>
        </button>
    </div>

    <!-- 編輯介面 -->
    <form id="edit-view"
        class="hidden-force fixed bottom-0 left-0 w-full h-auto min-h-[50vh] bg-[#FEFAEF] text-[#000000] z-50 p-6 md:p-8 pb-10 flex flex-col items-center justify-between gap-6 animate-in slide-in-from-bottom duration-300 rounded-t-[2rem]">

        <!-- 左上角切換分頁 (永遠黑色) -->
        <div class="absolute top-8 left-8 flex gap-4 text-[#000000]">
            <button type="button" id="tab-btn-time" onclick="switchTab('time')"
                class="opacity-100 transition-opacity duration-300 hover:opacity-70">
                <i data-lucide="clock" width="28" height="28"></i>
            </button>
            <button type="button" id="tab-btn-font" onclick="switchTab('font')"
                class="opacity-100 transition-opacity duration-300 hover:opacity-70">
                <i data-lucide="type" width="28" height="28"></i>
            </button>
        </div>

        <!-- 右上角確認/取消 -->
        <div class="absolute top-8 right-8 flex gap-4 text-[#000000]">
            <button type="button" onclick="closeEditMode()">
                <i data-lucide="x" width="32" height="32"></i>
            </button>
            <button type="submit" id="confirm-btn">
                <i data-lucide="check" width="32" height="32"></i>
            </button>
        </div>

        <div class="flex-1 w-full flex flex-col items-center justify-center mt-20 mb-8">

            <!-- 時間設定區塊 -->
            <div id="section-time" class="flex flex-col items-center gap-12 w-full transition-opacity duration-300">
                <h3 id="modal-title"
                    class="text-xl font-bold tracking-wide text-[#666666] text-center w-full absolute top-10 left-0 pointer-events-none">
                    設定時間</h3>

                <div id="time-inputs-container"
                    class="flex items-center justify-center gap-2 md:gap-4 text-7xl md:text-8xl font-bold transition-all duration-300">

                    <!-- 小時輸入 -->
                    <div id="hour-group" class="hidden-force flex items-center gap-2 md:gap-4">
                        <div class="relative group">
                            <input id="hour-input" type="text" inputmode="numeric" placeholder="00"
                                class="w-32 md:w-40 bg-transparent border-b-[4px] border-[#A3A3A3] text-[#A3A3A3] focus:border-[#000000] focus:text-[#000000] outline-none text-center placeholder:text-[#D1D1D1] pb-2 transition-colors" />
                        </div>
                    </div>

                    <!-- 分鐘/秒數輸入 -->
                    <div id="min-sec-group" class="flex items-center gap-2 md:gap-4">
                        <div class="relative group">
                            <input id="min-input" type="text" inputmode="numeric" placeholder="00"
                                class="w-32 md:w-40 bg-transparent border-b-[4px] border-[#A3A3A3] text-[#A3A3A3] focus:border-[#000000] focus:text-[#000000] outline-none text-center placeholder:text-[#D1D1D1] pb-2 transition-colors" />
                        </div>
                        <span id="time-colon" class="text-[#A3A3A3] pb-4 transition-colors">:</span>
                        <div class="relative group">
                            <input id="sec-input" type="text" inputmode="numeric" placeholder="00"
                                class="w-32 md:w-40 bg-transparent border-b-[4px] border-[#A3A3A3] text-[#A3A3A3] focus:border-[#000000] focus:text-[#000000] outline-none text-center placeholder:text-[#D1D1D1] pb-2 transition-colors" />
                        </div>
                    </div>
                </div>

                <!-- 統一使用藥丸狀按鈕樣式 -->
                <div class="flex flex-wrap justify-center gap-4 w-full px-4 mt-auto">
                    <button type="button" id="btn-history-1" onclick="useHistory(0)"
                        class="setting-pill-btn font-bold">5m</button>
                    <!-- 格式切換按鈕 -->
                    <button type="button" id="btn-format-toggle" onclick="toggleFormat()"
                        class="setting-pill-btn font-bold">格式</button>
                    <button type="button" onclick="resetInputs()" class="setting-pill-btn font-bold">歸零</button>
                    <button type="button" id="btn-toggle-hour" onclick="toggleHourInput()"
                        class="setting-pill-btn font-bold">小時</button>
                </div>
            </div>

            <!-- 字體設定區塊 -->
            <div id="section-font"
                class="hidden-force flex flex-col items-center justify-center gap-8 w-full px-8 transition-opacity duration-300">
                <div class="text-4xl font-bold tracking-tight text-[#000000]" id="font-size-display">160px</div>
                <!-- 縮短滑桿寬度 max-w-xs -->
                <div class="w-full relative py-4 max-w-xs">
                    <input type="range" id="font-slider" min="20" max="600" value="160" step="5" class="w-full">
                </div>

                <!-- 精簡為兩個切換按鈕 -->
                <div class="flex gap-6 mt-4">
                    <button type="button" id="btn-toggle-family" onclick="toggleFontFamily()"
                        class="setting-pill-btn active">字體：無襯線</button>
                    <button type="button" id="btn-toggle-weight" onclick="toggleFontWeight()"
                        class="setting-pill-btn active">粗細：粗體</button>
                </div>
            </div>

        </div>
    </form>

    <!-- 版權文字固定底部 -->
    <div
        class="fixed bottom-4 left-0 w-full text-center text-[10px] text-[#ffffff] opacity-30 select-none pointer-events-none tracking-widest z-10">
        &copy; <span id="year-display">Loading...</span> Gaolin
    </div>

    <script>
        lucide.createIcons();

        // 升級版本號以刷新緩存
        const STATE_KEY = 'gaolin_timer_state_v9';
        const TIPS_KEY = 'gaolin_timer_tips_shown';
        const MAX_TIME_SECONDS = 99 * 3600 + 59 * 60 + 59;
        const MAX_TIME_MS = MAX_TIME_SECONDS * 1000;
        const MAX_FONT_SIZE = 600;

        let appMode = 'timer';

        let initialTime = 3599;
        let timeLeftMs = 3599000;
        let isTimerActive = false;
        let timerTarget = null;

        let stopwatchTime = 0;
        let initialStopwatchTime = 0;
        let isStopwatchActive = false;
        let stopwatchStartTime = null;

        let intervalId = null;
        let currentEditMode = 'time';
        let currentFontSize = 160;
        let currentFontFamily = 'sans';
        let currentFontWeight = 'bold';
        let isLongFormat = true;
        let showHoursInput = false;
        let historyTimes = [300];
        let isTimeModified = false;

        let audioCtx;

        const timerDisplay = document.getElementById('timer-display');
        const timerStatus = document.getElementById('timer-status');
        const progressBar = document.getElementById('progress-bar');
        const playBtn = document.getElementById('play-pause-btn');
        const playWrapper = document.getElementById('play-icon-wrapper');
        const pauseWrapper = document.getElementById('pause-icon-wrapper');
        const controlsView = document.getElementById('controls-view');
        const editView = document.getElementById('edit-view');
        const topBar = document.getElementById('top-bar');
        const body = document.body;

        const domHourInput = document.getElementById('hour-input');
        const domMinInput = document.getElementById('min-input');
        const domSecInput = document.getElementById('sec-input');
        const hourGroup = document.getElementById('hour-group');
        const minSecGroup = document.getElementById('min-sec-group');
        const btnToggleHour = document.getElementById('btn-toggle-hour');
        const timeColon = document.getElementById('time-colon');
        const confirmBtn = document.getElementById('confirm-btn');
        const modalTitle = document.getElementById('modal-title');
        const sectionTime = document.getElementById('section-time');
        const sectionFont = document.getElementById('section-font');
        const fontSlider = document.getElementById('font-slider');
        const fontSizeDisplay = document.getElementById('font-size-display');
        const tabBtnTime = document.getElementById('tab-btn-time');
        const tabBtnFont = document.getElementById('tab-btn-font');
        const btnHistory1 = document.getElementById('btn-history-1');
        const btnToggleFamily = document.getElementById('btn-toggle-family');
        const btnToggleWeight = document.getElementById('btn-toggle-weight');

        function loadState() {
            const savedJSON = localStorage.getItem(STATE_KEY);
            if (savedJSON) {
                try {
                    const state = JSON.parse(savedJSON);

                    appMode = state.appMode || 'timer';
                    currentFontSize = Math.min(state.fontSize || 160, MAX_FONT_SIZE);
                    currentFontFamily = state.fontFamily || 'sans';
                    currentFontWeight = state.fontWeight || 'bold';
                    isLongFormat = state.isLongFormat ?? true;
                    historyTimes = state.history || [300];

                    initialTime = state.timer.initial || 3599;
                    if (state.timer.isActive && state.timer.target) {
                        isTimerActive = true;
                        timerTarget = state.timer.target;
                        const now = Date.now();
                        const remaining = timerTarget - now;
                        if (remaining <= 0) {
                            timeLeftMs = 0;
                            isTimerActive = false;
                            timerTarget = null;
                        } else {
                            timeLeftMs = remaining;
                        }
                    } else {
                        isTimerActive = false;
                        timeLeftMs = state.timer.timeLeftMs ?? (initialTime * 1000);
                    }

                    initialStopwatchTime = state.stopwatch.initial || 0;
                    if (state.stopwatch.isActive && state.stopwatch.startTime) {
                        isStopwatchActive = true;
                        stopwatchStartTime = state.stopwatch.startTime;
                        const now = Date.now();
                        const elapsed = now - stopwatchStartTime;
                        if (elapsed >= MAX_TIME_MS) {
                            stopwatchTime = MAX_TIME_MS;
                            isStopwatchActive = false;
                        } else {
                            stopwatchTime = elapsed;
                        }
                    } else {
                        isStopwatchActive = false;
                        stopwatchTime = state.stopwatch.accumulated || initialStopwatchTime;
                    }

                } catch (e) {
                    console.error("State Load Error:", e);
                }
            }

            updateUIFromState();
            if (isTimerActive || isStopwatchActive) {
                startIntervalLoop();
            }
        }

        function saveState() {
            const state = {
                appMode: appMode,
                fontSize: currentFontSize,
                fontFamily: currentFontFamily,
                fontWeight: currentFontWeight,
                isLongFormat: isLongFormat,
                history: historyTimes,
                timer: {
                    initial: initialTime,
                    isActive: isTimerActive,
                    timeLeftMs: timeLeftMs,
                    target: timerTarget
                },
                stopwatch: {
                    initial: initialStopwatchTime,
                    isActive: isStopwatchActive,
                    accumulated: stopwatchTime,
                    startTime: stopwatchStartTime
                }
            };
            localStorage.setItem(STATE_KEY, JSON.stringify(state));
        }

        function updateUIFromState() {
            document.getElementById('btn-mode-timer').classList.toggle('active', appMode === 'timer');
            document.getElementById('btn-mode-stopwatch').classList.toggle('active', appMode === 'stopwatch');

            if (fontSlider) fontSlider.value = currentFontSize;
            if (fontSizeDisplay) fontSizeDisplay.textContent = `${currentFontSize}px`;

            applyFontStyles();
            updateHistoryButtons();
            updateDisplay();
        }

        function applyFontStyles() {
            // Apply Family
            if (currentFontFamily === 'sans') {
                btnToggleFamily.textContent = '字體：無襯線';
                timerDisplay.style.fontFamily = "'Noto Sans', system-ui, sans-serif";
            } else {
                btnToggleFamily.textContent = '字體：襯線';
                timerDisplay.style.fontFamily = "'Noto Serif', Georgia, serif";
            }

            // Apply Weight
            if (currentFontWeight === 'bold') {
                btnToggleWeight.textContent = '粗細：粗體';
                timerDisplay.style.fontWeight = '700';
            } else {
                btnToggleWeight.textContent = '粗細：細體';
                timerDisplay.style.fontWeight = '400';
            }
        }

        function toggleFontFamily() {
            currentFontFamily = currentFontFamily === 'sans' ? 'serif' : 'sans';
            applyFontStyles();
            saveState();
        }

        function toggleFontWeight() {
            currentFontWeight = currentFontWeight === 'bold' ? 'normal' : 'bold';
            applyFontStyles();
            saveState();
        }

        function updateHistoryButtons() {
            btnHistory1.textContent = formatButtonTime(historyTimes[0]);
        }

        function formatButtonTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;

            if (h > 0) return `${h}h${m > 0 ? m + 'm' : ''}`;
            if (m > 0) return `${m}m${s > 0 ? s + 's' : ''}`;
            return `${s}s`;
        }

        function toggleFormat() {
            isLongFormat = !isLongFormat;
            saveState();

            if (isTimeModified) {
                updatePreview();
            } else {
                updateDisplay();
            }
        }

        function setupInputFocus(el) {
            el.addEventListener('focus', (e) => {
                e.target.dataset.oldValue = e.target.value;
                e.target.value = '';
            });
            el.addEventListener('blur', (e) => {
                if (e.target.value === '') {
                    e.target.value = e.target.dataset.oldValue || '';
                }
                updateInputColors();
                checkInputs();
                if (isTimeModified) updatePreview();
            });
        }
        setupInputFocus(domHourInput);
        setupInputFocus(domMinInput);
        setupInputFocus(domSecInput);

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playAlarmSound() {
            initAudio();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);

            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);
                gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.5);
            }, 600);
        }

        function getSafeFontSize(requestedSize, textContent) {
            const windowHeight = window.innerHeight;
            const windowWidth = window.innerWidth;
            const reservedHeight = 280;
            const maxSafeHeight = windowHeight - reservedHeight;
            const charCount = textContent ? textContent.length : 5;
            const widthRatio = charCount > 6 ? 5.5 : 3.5;
            const paddingX = 40;
            const maxSafeWidth = (windowWidth - paddingX) / widthRatio;
            const safeSize = Math.floor(Math.min(requestedSize, Math.max(20, maxSafeHeight), maxSafeWidth));
            return safeSize;
        }

        function formatTimeDisplay(ms, isTimer) {
            if (ms < 0) ms = 0;

            let totalSeconds;
            if (isTimer && (!isLongFormat || ms >= 3600000) && ms > 0) {
                totalSeconds = Math.ceil(ms / 1000);
            } else {
                totalSeconds = Math.floor(ms / 1000);
            }

            const tempH = Math.floor(ms / 3600000);
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            const cs = Math.floor((ms % 1000) / 10);

            if (isLongFormat) {
                if (tempH > 0) {
                    return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                } else {
                    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${cs.toString().padStart(2, '0')}`;
                }
            } else {
                if (tempH > 0) {
                    return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
                } else {
                    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                }
            }
        }

        function updateDisplay() {
            let timeString = "";
            let currentIsActive = false;

            if (appMode === 'timer') {
                timeString = formatTimeDisplay(timeLeftMs, true);
                currentIsActive = isTimerActive;
                const progress = initialTime > 0 ? (timeLeftMs / (initialTime * 1000)) * 100 : 0;
                progressBar.style.width = `${progress}%`;
                progressBar.classList.remove('hidden-bar');
            } else {
                timeString = formatTimeDisplay(stopwatchTime, false);
                currentIsActive = isStopwatchActive;
                progressBar.classList.add('hidden-bar');
            }

            timerDisplay.textContent = timeString;
            document.title = currentIsActive ? `(${timeString}) 計時器` : '計時器';

            timerDisplay.style.fontSize = `${Math.min(currentFontSize, MAX_FONT_SIZE)}px`;

            if (currentIsActive) {
                playWrapper.classList.add('hidden-force');
                pauseWrapper.classList.remove('hidden-force');
                playBtn.disabled = false;

                timerStatus.classList.remove('opacity-100');
                timerStatus.classList.add('opacity-0');
            } else {
                playWrapper.classList.remove('hidden-force');
                pauseWrapper.classList.add('hidden-force');

                if (appMode === 'stopwatch' && stopwatchTime >= MAX_TIME_MS) {
                    playBtn.disabled = true;
                } else {
                    playBtn.disabled = false;
                }

                if (appMode === 'timer') {
                    timerStatus.textContent = "Tips: 關閉視窗還是會繼續跑喔";
                } else {
                    if (stopwatchTime >= MAX_TIME_MS) {
                        timerStatus.textContent = "已達上限";
                    } else {
                        timerStatus.textContent = "碼錶已暫停";
                    }
                }
                timerStatus.classList.remove('opacity-0');
                timerStatus.classList.add('opacity-100');
            }
        }

        function startIntervalLoop() {
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(() => {
                const now = Date.now();
                let needSave = false;

                if (isTimerActive) {
                    const remaining = timerTarget - now;
                    if (remaining <= 0) {
                        timeLeftMs = 0;
                        isTimerActive = false;
                        timerTarget = null;
                        playAlarmSound();
                        needSave = true;
                    } else {
                        if (timeLeftMs !== remaining) {
                            timeLeftMs = remaining;
                            needSave = true;
                        }
                    }
                }

                if (isStopwatchActive) {
                    const elapsed = now - stopwatchStartTime;
                    if (elapsed >= MAX_TIME_MS) {
                        stopwatchTime = MAX_TIME_MS;
                        isStopwatchActive = false;
                        playAlarmSound();
                        needSave = true;
                    } else {
                        stopwatchTime = elapsed;
                    }
                }

                if (!isTimerActive && !isStopwatchActive) {
                    clearInterval(intervalId);
                }

                updateDisplay();
                if (needSave) saveState();

            }, 16);
        }

        function switchAppMode(mode) {
            if (mode === appMode) return;
            appMode = mode;
            updateUIFromState();
            saveState();
        }

        function toggleTimer() {
            initAudio();
            const now = Date.now();

            if (appMode === 'timer') {
                if (timeLeftMs === 0 && !isTimerActive) return;

                if (isTimerActive) {
                    isTimerActive = false;
                    timerTarget = null;
                } else {
                    isTimerActive = true;
                    timerTarget = now + timeLeftMs;
                }
            } else {
                if (stopwatchTime >= MAX_TIME_MS) return;

                if (isStopwatchActive) {
                    isStopwatchActive = false;
                    stopwatchTime = now - stopwatchStartTime;
                    stopwatchStartTime = null;
                } else {
                    isStopwatchActive = true;
                    stopwatchStartTime = now - stopwatchTime;
                }
            }

            if (isTimerActive || isStopwatchActive) {
                startIntervalLoop();
            }

            updateDisplay();
            saveState();
        }

        function resetTimer() {
            if (appMode === 'timer') {
                isTimerActive = false;
                timerTarget = null;
                timeLeftMs = initialTime * 1000;
            } else {
                isStopwatchActive = false;
                stopwatchStartTime = null;
                stopwatchTime = initialStopwatchTime;
            }

            if (!isTimerActive && !isStopwatchActive) {
                if (intervalId) clearInterval(intervalId);
            }

            playBtn.disabled = false;
            updateDisplay();
            saveState();
        }

        function goHome() {
            console.log("Navigating Home");
            location.href = "../index.html";
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function openEditMode() {
            if (appMode === 'timer' && isTimerActive) toggleTimer();
            if (appMode === 'stopwatch' && isStopwatchActive) toggleTimer();

            isTimeModified = false;

            topBar.classList.add('hidden-force');
            controlsView.classList.add('hidden-force');
            editView.classList.remove('hidden-force');
            body.classList.add('edit-mode-active');

            if (fontSlider) fontSlider.value = currentFontSize;
            if (fontSizeDisplay) fontSizeDisplay.textContent = `${currentFontSize}px`;

            switchTab('time');

            let loadTime = appMode === 'timer' ? initialTime : Math.floor(initialStopwatchTime / 1000);
            let h = Math.floor(loadTime / 3600);
            let m = Math.floor((loadTime % 3600) / 60);
            let s = loadTime % 60;

            domHourInput.value = h > 0 ? h.toString().padStart(2, '0') : "";
            domMinInput.value = m.toString().padStart(2, '0');
            domSecInput.value = s.toString().padStart(2, '0');

            if (h > 0) {
                if (!showHoursInput) toggleHourInput();
            } else {
                if (showHoursInput) toggleHourInput();
            }

            updateInputColors();
            checkInputs();
        }

        function closeEditMode() {
            topBar.classList.remove('hidden-force');
            controlsView.classList.remove('hidden-force');
            editView.classList.add('hidden-force');
            body.classList.remove('edit-mode-active');
            updateDisplay();
        }

        function switchTab(mode) {
            currentEditMode = mode;
            const sectionTime = document.getElementById('section-time');
            const sectionFont = document.getElementById('section-font');
            const modalTitle = document.getElementById('modal-title');

            if (mode === 'time') {
                modalTitle.textContent = showHoursInput ? "設定小時" : "設定時間";
                sectionTime.classList.remove('hidden-force');
                sectionFont.classList.add('hidden-force');
                checkInputs();
            } else {
                modalTitle.textContent = "文字大小";
                sectionTime.classList.add('hidden-force');
                sectionFont.classList.remove('hidden-force');
                checkInputs();
            }
        }

        function toggleHourInput() {
            showHoursInput = !showHoursInput;
            const hourGroup = document.getElementById('hour-group');
            const minSecGroup = document.getElementById('min-sec-group');
            const btn = document.getElementById('btn-toggle-hour');
            const modalTitle = document.getElementById('modal-title');

            if (showHoursInput) {
                hourGroup.classList.remove('hidden-force');
                hourGroup.classList.add('flex');
                minSecGroup.classList.add('hidden-force');
                btn.classList.add('active');
                modalTitle.textContent = "設定小時";
            } else {
                hourGroup.classList.add('hidden-force');
                hourGroup.classList.remove('flex');
                minSecGroup.classList.remove('hidden-force');
                btn.classList.remove('active');
                modalTitle.textContent = "設定時間";
            }
            updateInputColors();
            if (isTimeModified) updatePreview();
        }

        function resetInputs() {
            isTimeModified = true;
            domHourInput.value = "";
            domMinInput.value = "";
            domSecInput.value = "";

            updateInputColors();
            checkInputs();
            updatePreview();
        }

        function checkInputs() {
            confirmBtn.disabled = false;
        }

        function updateInputColors() {
            const styleInput = (el) => {
                if (el.value.length > 0) {
                    el.classList.remove('border-[#A3A3A3]', 'text-[#A3A3A3]');
                    el.classList.add('border-[#000000]', 'text-[#000000]');
                } else {
                    el.classList.add('border-[#A3A3A3]', 'text-[#A3A3A3]');
                    el.classList.remove('border-[#000000]', 'text-[#000000]');
                }
            };
            styleInput(domHourInput);
            styleInput(domMinInput);
            styleInput(domSecInput);

            if (domHourInput.value.length > 0 || domMinInput.value.length > 0 || domSecInput.value.length > 0) {
                timeColon.classList.remove('text-[#A3A3A3]');
                timeColon.classList.add('text-[#000000]');
            } else {
                timeColon.classList.add('text-[#A3A3A3]');
                timeColon.classList.remove('text-[#000000]');
            }
        }

        function updatePreview() {
            if (editView.classList.contains('hidden-force')) return;
            if (!isTimeModified) return;

            let h = parseInt(domHourInput.value) || 0;
            let m = parseInt(domMinInput.value) || 0;
            let s = parseInt(domSecInput.value) || 0;

            let totalSecs = (h * 3600) + (m * 60) + s;

            timerDisplay.textContent = formatTimeDisplay(totalSecs * 1000, appMode === 'timer');

            const requestedSize = parseInt(fontSlider.value);
            timerDisplay.style.fontSize = `${Math.min(requestedSize, MAX_FONT_SIZE)}px`;
        }

        function useHistory(index) {
            isTimeModified = true;
            quickSetTime(historyTimes[index] / 60);
        }

        function quickSetTime(minutes) {
            let h = 0, m = 0, s = 0;
            let totalSeconds = Math.round(minutes * 60);

            h = Math.floor(totalSeconds / 3600);
            m = Math.floor((totalSeconds % 3600) / 60);
            s = totalSeconds % 60;

            if (h > 0 && !showHoursInput) {
                toggleHourInput();
            }

            domHourInput.value = h > 0 ? h.toString().padStart(2, '0') : "";
            domMinInput.value = m.toString().padStart(2, '0');
            domSecInput.value = s.toString().padStart(2, '0');

            updateInputColors();
            checkInputs();
            updatePreview();
        }

        function addToHistory(seconds) {
            if (seconds === 0) return;
            if (historyTimes[0] === seconds) return;

            historyTimes.unshift(seconds);
            historyTimes = historyTimes.slice(0, 1);
            updateHistoryButtons();
        }

        function submitEdit(e) {
            if (e) e.preventDefault();

            if (isTimeModified) {
                let h = parseInt(domHourInput.value) || 0;
                let m = parseInt(domMinInput.value) || 0;
                let s = parseInt(domSecInput.value) || 0;

                if (s > 59) s = 59;
                if (m > 59) {
                    h += Math.floor(m / 60);
                    m = m % 60;
                }

                let totalSecs = (h * 3600) + (m * 60) + s;

                if (totalSecs > MAX_TIME_SECONDS) totalSecs = MAX_TIME_SECONDS;

                if (totalSecs >= 0) {
                    addToHistory(totalSecs);

                    if (appMode === 'timer') {
                        initialTime = totalSecs;
                        timeLeftMs = totalSecs * 1000;
                    } else {
                        initialStopwatchTime = totalSecs * 1000;
                        stopwatchTime = initialStopwatchTime;
                    }
                }
            }

            playBtn.disabled = false;
            updateDisplay();
            saveState();
            closeEditMode();
        }

        function handleInput(e) {
            isTimeModified = true;
            let val = e.target.value;
            val = val.replace(/\D/g, '');
            if (val.length > 2) val = val.slice(-1);
            e.target.value = val;
            updateInputColors();
            checkInputs();
            updatePreview();
        }

        domHourInput.addEventListener('input', handleInput);
        domMinInput.addEventListener('input', handleInput);
        domSecInput.addEventListener('input', handleInput);

        fontSlider.addEventListener('input', (e) => {
            let requestedSize = parseInt(e.target.value);
            if (requestedSize > MAX_FONT_SIZE) {
                e.target.value = MAX_FONT_SIZE;
                requestedSize = MAX_FONT_SIZE;
            }
            currentFontSize = requestedSize;
            fontSizeDisplay.textContent = `${requestedSize}px`;
            timerDisplay.style.fontSize = `${requestedSize}px`;
        });

        editView.addEventListener('submit', submitEdit);

        document.addEventListener('fullscreenchange', () => {
            const iconMaximize = document.getElementById('icon-maximize');
            const iconMinimize = document.getElementById('icon-minimize');
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                iconMaximize.classList.add('hidden-force');
                iconMinimize.classList.remove('hidden-force');
                btn.title = "退出全螢幕";
            } else {
                iconMaximize.classList.remove('hidden-force');
                iconMinimize.classList.add('hidden-force');
                btn.title = "全螢幕 (Esc退出)";
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                toggleTimer();
            }
            if (e.code === 'Escape') {
                if (!editView.classList.contains('hidden-force')) {
                    closeEditMode();
                }
            }
        });

        // 網路時間校時
        async function initCopyrightYear() {
            const display = document.getElementById('year-display');
            const localYear = new Date().getFullYear();
            display.textContent = localYear;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);
                const response = await fetch('https://worldtimeapi.org/api/timezone/Asia/Taipei', {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    const networkYear = data.datetime.substring(0, 4);
                    display.textContent = networkYear;
                }
            } catch (error) {
                console.log('網路校時失敗，維持系統時間');
            }
        }

        window.addEventListener('load', () => {
            loadState();
            initCopyrightYear();
            window.addEventListener('resize', updateDisplay);
        });

    </script>
</body>
