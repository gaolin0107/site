<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Callback</title>
    <style>
        body {
            margin: 0;
            height: 100dvh;
            background-color: #FEFAEF;
        }
    </style>
</head>

<body>
    <script>
        // 從 URL hash 中提取 access_token
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');

        if (accessToken) {
            // 儲存 access_token 以供後續使用
            localStorage.setItem('access_token', accessToken);

            // 獲取用戶資料
            fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { Authorization: `Bearer ${accessToken}` },
            })
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(userInfo => {
                    if (userInfo.picture) {
                        localStorage.setItem('userPicture', userInfo.picture); // 保存頭像
                    }
                    if (userInfo.name) {
                        localStorage.setItem('userName', userInfo.name); // 保存名字
                    }
                    if (userInfo.email) {
                        localStorage.setItem('userEmail', userInfo.email); // 保存 email
                    }

                    // 取得資料後重定向
                    window.location.href = '/index.html';
                })
                .catch(error => {
                    console.error('無法獲取用戶信息：', error);
                    alert('發生錯誤，請稍後再試。');
                });
        } else if (window.location.pathname.includes('callback.html')) {
            alert('無法獲取授權，請重新登入。');
        }

    </script>
</body>

</html>
