<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#222222">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>計時器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .hidden-force {
            display: none !important;
        }

        input:focus {
            outline: none;
        }

        :root {
            --cream: #FEFAEF;
            --dark: #222222;
            --grey: #A3A3A3;
        }

        .text-cream {
            color: var(--cream);
        }

        .bg-cream {
            background-color: var(--cream);
        }

        .text-dark {
            color: var(--dark);
        }

        .bg-dark {
            background-color: var(--dark);
        }

        .btn-hover {
            transition: all 0.2s ease;
        }

        .btn-hover:hover {
            transform: scale(1.1);
            background-color: #ffffff;
        }

        .btn-hover:active {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .modal-btn:active {
            transform: scale(0.95);
        }

        /* 預設/歷史按鈕樣式 */
        .preset-btn {
            border: 1px solid #A3A3A3;
            color: #A3A3A3;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .preset-btn:hover {
            border-color: #222222;
            color: #222222;
            background-color: rgba(34, 34, 34, 0.05);
        }

        /* 功能按鈕 */
        .func-btn {
            background-color: rgba(34, 34, 34, 0.05);
            color: #555;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .func-btn:hover {
            background-color: #222222;
            color: #FEFAEF;
        }

        .func-btn.active {
            background-color: #222222;
            color: #FEFAEF;
        }

        .mode-switch-container {
            background-color: rgba(254, 250, 239, 0.1);
            border-radius: 9999px;
            padding: 4px;
            display: flex;
            gap: 4px;
        }

        .mode-btn {
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(254, 250, 239, 0.5);
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background-color: var(--cream);
            color: var(--dark);
            font-weight: 700;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #222222;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 0 0 4px #FEFAEF;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #222222;
            border-radius: 2px;
        }

        input[type=range]:focus {
            outline: none;
        }

        #timer-container {
            transition: transform 0.3s ease-in-out;
        }

        .edit-mode-active #timer-container {
            transform: translateY(-20vh);
        }

        #progress-bar {
            transition: width 1s linear;
        }

        #progress-bar.hidden-bar {
            opacity: 0;
            width: 0 !important;
            transition: opacity 0.3s, width 0s 0.3s;
        }
    </style>
</head>

<body
    class="min-h-screen bg-[#222222] text-[#FEFAEF] flex flex-col items-center justify-center relative font-sans selection:bg-orange-500/30 overflow-hidden">

    <div class="absolute top-0 left-0 w-full h-1 bg-[#222222] z-50">
        <div id="progress-bar" class="h-full bg-cream w-full"></div>
    </div>

    <div id="top-bar"
        class="absolute top-0 left-0 w-full p-4 md:p-8 flex justify-between items-center z-10 transition-opacity duration-300">
        <button onclick="goHome()"
            class="w-12 h-12 rounded-full bg-cream text-dark flex items-center justify-center btn-hover shadow-lg"
            title="回首頁">
            <i data-lucide="home" width="24" height="24"></i>
        </button>

        <div class="mode-switch-container">
            <button onclick="switchAppMode('timer')" id="btn-mode-timer" class="mode-btn active">計時器</button>
            <button onclick="switchAppMode('stopwatch')" id="btn-mode-stopwatch" class="mode-btn">碼錶</button>
        </div>

        <button onclick="toggleFullscreen()" id="fullscreen-btn"
            class="w-12 h-12 rounded-full bg-cream text-dark flex items-center justify-center btn-hover shadow-lg"
            title="全螢幕 (Esc退出)">
            <i data-lucide="maximize" width="24" height="24" id="icon-maximize"></i>
            <i data-lucide="minimize" width="24" height="24" id="icon-minimize" class="hidden-force"></i>
        </button>
    </div>

    <div class="flex flex-col items-center gap-6 md:gap-12 w-full max-w-2xl px-4">

        <div id="timer-container"
            class="relative group cursor-default w-full flex flex-col items-center justify-center">

            <div id="timer-status"
                class="text-sm font-medium tracking-widest uppercase opacity-0 transition-opacity duration-300 whitespace-nowrap mb-2 min-h-[20px]">
            </div>

            <h1 id="timer-display"
                class="font-bold tracking-tight text-cream leading-none tabular-nums font-sans whitespace-nowrap">
                Loading...
            </h1>
        </div>

        <div id="controls-view" class="flex items-center gap-6 animate-in fade-in zoom-in duration-300">

            <button onclick="resetTimer()"
                class="w-14 h-14 rounded-full bg-cream text-dark flex items-center justify-center btn-hover shadow-xl"
                title="重置">
                <i data-lucide="rotate-ccw" width="24" height="24"></i>
            </button>

            <button id="play-pause-btn" onclick="toggleTimer()"
                class="w-14 h-14 rounded-full bg-cream text-dark flex items-center justify-center btn-hover shadow-xl disabled:opacity-50 disabled:cursor-not-allowed"
                title="開始/暫停 (Space)">
                <span id="play-icon-wrapper" class="flex items-center justify-center">
                    <i data-lucide="play" width="24" height="24" class="fill-current ml-0.5"></i>
                </span>
                <span id="pause-icon-wrapper" class="hidden-force flex items-center justify-center">
                    <i data-lucide="pause" width="24" height="24" class="fill-current"></i>
                </span>
            </button>

            <button onclick="openEditMode()"
                class="w-14 h-14 rounded-full bg-cream text-dark flex items-center justify-center btn-hover shadow-xl"
                title="設定">
                <i data-lucide="pencil" width="24" height="24"></i>
            </button>
        </div>

        <form id="edit-view"
            class="hidden-force fixed bottom-0 left-0 w-full h-auto min-h-[50vh] bg-[#FEFAEF] rounded-t-[2rem] md:rounded-t-[3rem] shadow-[0_-10px_40px_rgba(0,0,0,0.5)] z-50 p-6 md:p-8 pb-10 flex flex-col items-center justify-between gap-6 animate-in slide-in-from-bottom duration-300">

            <div class="absolute top-6 left-6 flex gap-3">
                <button type="button" id="tab-btn-time" onclick="switchTab('time')"
                    class="w-10 h-10 rounded-full bg-[#222222] text-white flex items-center justify-center transition-transform active:scale-95 hover:bg-neutral-800">
                    <i data-lucide="clock" width="20" height="20"></i>
                </button>
                <button type="button" id="tab-btn-font" onclick="switchTab('font')"
                    class="w-10 h-10 rounded-full bg-[#222222] text-white flex items-center justify-center transition-transform active:scale-95 hover:bg-neutral-800">
                    <i data-lucide="type" width="20" height="20"></i>
                </button>
            </div>

            <div class="absolute top-6 right-6 flex gap-3">
                <button type="button" onclick="closeEditMode()"
                    class="w-10 h-10 rounded-full bg-[#222222] text-white flex items-center justify-center transition-transform active:scale-95 hover:bg-neutral-800">
                    <i data-lucide="x" width="20" height="20"></i>
                </button>
                <button type="submit" id="confirm-btn"
                    class="w-10 h-10 rounded-full bg-[#222222] text-white flex items-center justify-center transition-transform active:scale-95 hover:bg-neutral-800 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="check" width="20" height="20"></i>
                </button>
            </div>

            <div class="flex-1 w-full flex items-center justify-center mt-12 mb-8">

                <div id="section-time" class="flex flex-col items-center gap-8 w-full transition-opacity duration-300">

                    <h3 id="modal-title"
                        class="text-[#222222] text-xl font-bold tracking-wide absolute top-8 left-1/2 -translate-x-1/2">
                        設定時間</h3>

                    <div id="time-inputs-container"
                        class="flex items-center justify-center gap-2 md:gap-4 text-7xl md:text-8xl font-bold transition-all duration-300">

                        <!-- Hour Input (Only shown when hour mode is active) -->
                        <div id="hour-group" class="hidden-force flex items-center gap-2 md:gap-4">
                            <div class="relative group">
                                <input id="hour-input" type="text" inputmode="numeric" placeholder="00"
                                    class="w-32 md:w-40 bg-transparent border-b-[6px] border-[#A3A3A3]/50 focus:border-[#222222] outline-none text-center placeholder:text-[#A3A3A3] pb-2 transition-colors font-sans text-[#A3A3A3]" />
                            </div>
                            <!-- Colon removed per request -->
                            <span class="text-[#A3A3A3] pb-4 hidden-force" id="hour-colon">:</span>
                        </div>

                        <!-- Minute & Second Group (Hidden when hour mode is active) -->
                        <div id="min-sec-group" class="flex items-center gap-2 md:gap-4">
                            <div class="relative group">
                                <input id="min-input" type="text" inputmode="numeric" placeholder="00"
                                    class="w-32 md:w-40 bg-transparent border-b-[6px] border-[#A3A3A3]/50 focus:border-[#222222] outline-none text-center placeholder:text-[#A3A3A3] pb-2 transition-colors font-sans text-[#A3A3A3]" />
                            </div>
                            <span id="time-colon" class="text-[#A3A3A3] pb-4 transition-colors">:</span>
                            <div class="relative group">
                                <input id="sec-input" type="text" inputmode="numeric" placeholder="00"
                                    class="w-32 md:w-40 bg-transparent border-b-[6px] border-[#A3A3A3]/50 focus:border-[#222222] outline-none text-center placeholder:text-[#A3A3A3] pb-2 transition-colors font-sans text-[#A3A3A3]" />
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-wrap justify-center gap-3 w-full px-4 mt-auto">
                        <button type="button" id="btn-history-1" onclick="useHistory(0)"
                            class="preset-btn px-6 py-2.5 rounded-full text-sm font-medium">
                            5m
                        </button>
                        <button type="button" id="btn-history-2" onclick="useHistory(1)"
                            class="preset-btn px-6 py-2.5 rounded-full text-sm font-medium">
                            30m
                        </button>
                        <button type="button" onclick="resetInputs()"
                            class="func-btn px-6 py-2.5 rounded-full text-sm font-medium">
                            歸零
                        </button>
                        <button type="button" id="btn-toggle-hour" onclick="toggleHourInput()"
                            class="func-btn px-6 py-2.5 rounded-full text-sm font-medium">
                            小時
                        </button>
                    </div>

                </div>

                <div id="section-font"
                    class="hidden-force flex flex-col items-center justify-center gap-6 w-full px-4 md:px-8 transition-opacity duration-300">
                    <div class="text-[#222222] text-2xl font-bold tracking-tight font-sans" id="font-size-display">160px
                    </div>
                    <div class="w-full relative py-4 max-w-md">
                        <input type="range" id="font-slider" min="20" max="600" value="160" step="5" class="w-full">
                    </div>
                </div>

            </div>
        </form>

    </div>

    <script>
        lucide.createIcons();

        const STATE_KEY = 'gaolin_timer_state_v5_final';
        const TIPS_KEY = 'gaolin_timer_tips_shown';
        const MAX_TIME_SECONDS = 99 * 3600 + 59 * 60 + 59;
        const MAX_TIME_MS = MAX_TIME_SECONDS * 1000;

        let appMode = 'timer';

        let initialTime = 3599;
        let timeLeft = 3599;
        let isTimerActive = false;
        let timerTarget = null;

        let stopwatchTime = 0;
        let initialStopwatchTime = 0;
        let isStopwatchActive = false;
        let stopwatchStartTime = null;

        let intervalId = null;
        let currentEditMode = 'time';
        let currentFontSize = 160;
        let showHoursInput = false;
        let historyTimes = [300, 1800];

        let audioCtx;

        const timerDisplay = document.getElementById('timer-display');
        const timerStatus = document.getElementById('timer-status');
        const progressBar = document.getElementById('progress-bar');
        const playBtn = document.getElementById('play-pause-btn');
        const playWrapper = document.getElementById('play-icon-wrapper');
        const pauseWrapper = document.getElementById('pause-icon-wrapper');
        const controlsView = document.getElementById('controls-view');
        const editView = document.getElementById('edit-view');
        const topBar = document.getElementById('top-bar');
        const body = document.body;

        const domHourInput = document.getElementById('hour-input');
        const domMinInput = document.getElementById('min-input');
        const domSecInput = document.getElementById('sec-input');
        const hourGroup = document.getElementById('hour-group');
        const minSecGroup = document.getElementById('min-sec-group');
        const timeInputsContainer = document.getElementById('time-inputs-container');
        const btnToggleHour = document.getElementById('btn-toggle-hour');
        const timeColon = document.getElementById('time-colon');
        const hourColon = document.getElementById('hour-colon');
        const confirmBtn = document.getElementById('confirm-btn');
        const modalTitle = document.getElementById('modal-title');
        const sectionTime = document.getElementById('section-time');
        const sectionFont = document.getElementById('section-font');
        const fontSlider = document.getElementById('font-slider');
        const fontSizeDisplay = document.getElementById('font-size-display');
        const tabBtnTime = document.getElementById('tab-btn-time');
        const tabBtnFont = document.getElementById('tab-btn-font');
        const btnHistory1 = document.getElementById('btn-history-1');
        const btnHistory2 = document.getElementById('btn-history-2');

        function loadState() {
            const savedJSON = localStorage.getItem(STATE_KEY);
            if (savedJSON) {
                try {
                    const state = JSON.parse(savedJSON);

                    appMode = state.appMode || 'timer';
                    currentFontSize = state.fontSize || 160;
                    historyTimes = state.history || [300, 1800];

                    initialTime = state.timer.initial || 3599;
                    if (state.timer.isActive && state.timer.target) {
                        isTimerActive = true;
                        timerTarget = state.timer.target;
                        const now = Date.now();
                        const remaining = Math.ceil((timerTarget - now) / 1000);
                        if (remaining <= 0) {
                            timeLeft = 0;
                            isTimerActive = false;
                            timerTarget = null;
                        } else {
                            timeLeft = remaining;
                        }
                    } else {
                        isTimerActive = false;
                        timeLeft = state.timer.timeLeft;
                    }

                    initialStopwatchTime = state.stopwatch.initial || 0;
                    if (state.stopwatch.isActive && state.stopwatch.startTime) {
                        isStopwatchActive = true;
                        stopwatchStartTime = state.stopwatch.startTime;
                        const now = Date.now();
                        const elapsed = now - stopwatchStartTime;
                        if (elapsed >= MAX_TIME_MS) {
                            stopwatchTime = MAX_TIME_MS;
                            isStopwatchActive = false;
                        } else {
                            stopwatchTime = elapsed;
                        }
                    } else {
                        isStopwatchActive = false;
                        stopwatchTime = state.stopwatch.accumulated || initialStopwatchTime;
                    }

                } catch (e) {
                    console.error("Failed to load state", e);
                }
            }

            updateUIFromState();
            if (isTimerActive || isStopwatchActive) {
                startIntervalLoop();
            }
        }

        function saveState() {
            const state = {
                appMode: appMode,
                fontSize: currentFontSize,
                history: historyTimes,
                timer: {
                    initial: initialTime,
                    isActive: isTimerActive,
                    timeLeft: timeLeft,
                    target: timerTarget
                },
                stopwatch: {
                    initial: initialStopwatchTime,
                    isActive: isStopwatchActive,
                    accumulated: stopwatchTime,
                    startTime: stopwatchStartTime
                }
            };
            localStorage.setItem(STATE_KEY, JSON.stringify(state));
        }

        function updateUIFromState() {
            document.getElementById('btn-mode-timer').classList.toggle('active', appMode === 'timer');
            document.getElementById('btn-mode-stopwatch').classList.toggle('active', appMode === 'stopwatch');

            if (fontSlider) fontSlider.value = currentFontSize;
            if (fontSizeDisplay) fontSizeDisplay.textContent = `${currentFontSize}px`;

            updateHistoryButtons();
            updateDisplay();
        }

        function updateHistoryButtons() {
            btnHistory1.textContent = formatButtonTime(historyTimes[0]);
            btnHistory2.textContent = formatButtonTime(historyTimes[1]);
        }

        function formatButtonTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;

            if (h > 0) return `${h}h${m > 0 ? m + 'm' : ''}`;
            if (m > 0) return `${m}m${s > 0 ? s + 's' : ''}`;
            return `${s}s`;
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playAlarmSound() {
            initAudio();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);

            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);
                gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.5);
            }, 600);
        }

        function getSafeFontSize(requestedSize, textContent) {
            const windowHeight = window.innerHeight;
            const windowWidth = window.innerWidth;
            const reservedHeight = 280;
            const maxSafeHeight = windowHeight - reservedHeight;
            const charCount = textContent ? textContent.length : 5;
            const widthRatio = charCount > 6 ? 5.5 : 3.5;
            const paddingX = 40;
            const maxSafeWidth = (windowWidth - paddingX) / widthRatio;
            const safeSize = Math.floor(Math.min(requestedSize, Math.max(20, maxSafeHeight), maxSafeWidth));
            return safeSize;
        }

        function formatTimerTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            if (h > 0) return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function formatStopwatchTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const h = Math.floor(totalSeconds / 3600);
            if (h > 0) {
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = totalSeconds % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            } else {
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                const centiseconds = Math.floor((ms % 1000) / 10);
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
            }
        }

        function updateDisplay() {
            let timeString = "";
            let currentIsActive = false;

            if (appMode === 'timer') {
                timeString = formatTimerTime(timeLeft);
                currentIsActive = isTimerActive;
                const progress = initialTime > 0 ? (timeLeft / initialTime) * 100 : 0;
                progressBar.style.width = `${progress}%`;
                progressBar.classList.remove('hidden-bar');
            } else {
                timeString = formatStopwatchTime(stopwatchTime);
                currentIsActive = isStopwatchActive;
                progressBar.classList.add('hidden-bar');
            }

            timerDisplay.textContent = timeString;
            document.title = currentIsActive ? `(${timeString}) 計時器` : '計時器';

            const safeSize = getSafeFontSize(currentFontSize, timeString);
            timerDisplay.style.fontSize = `${safeSize}px`;

            if (currentIsActive) {
                playWrapper.classList.add('hidden-force');
                pauseWrapper.classList.remove('hidden-force');
                playBtn.disabled = false;

                timerStatus.classList.remove('opacity-100');
                timerStatus.classList.add('opacity-0');
            } else {
                playWrapper.classList.remove('hidden-force');
                pauseWrapper.classList.add('hidden-force');

                if (appMode === 'stopwatch' && stopwatchTime >= MAX_TIME_MS) {
                    playBtn.disabled = true;
                } else {
                    playBtn.disabled = false;
                }

                if (appMode === 'timer') {
                    timerStatus.textContent = "Tips: 關閉視窗還是會繼續跑喔";
                } else {
                    if (stopwatchTime >= MAX_TIME_MS) {
                        timerStatus.textContent = "已達上限";
                    } else {
                        timerStatus.textContent = "碼錶已暫停";
                    }
                }
                timerStatus.classList.remove('opacity-0');
                timerStatus.classList.add('opacity-100');
            }
        }

        function startIntervalLoop() {
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(() => {
                const now = Date.now();
                let needSave = false;

                if (isTimerActive) {
                    const remaining = Math.ceil((timerTarget - now) / 1000);
                    if (remaining <= 0) {
                        timeLeft = 0;
                        isTimerActive = false;
                        timerTarget = null;
                        playAlarmSound();
                        needSave = true;
                    } else {
                        if (timeLeft !== remaining) {
                            timeLeft = remaining;
                            needSave = true;
                        }
                    }
                }

                if (isStopwatchActive) {
                    const elapsed = now - stopwatchStartTime;
                    if (elapsed >= MAX_TIME_MS) {
                        stopwatchTime = MAX_TIME_MS;
                        isStopwatchActive = false;
                        playAlarmSound();
                        needSave = true;
                    } else {
                        stopwatchTime = elapsed;
                    }
                }

                if (!isTimerActive && !isStopwatchActive) {
                    clearInterval(intervalId);
                }

                updateDisplay();
                if (needSave) saveState();

            }, 16);
        }

        function switchAppMode(mode) {
            if (mode === appMode) return;
            appMode = mode;
            updateUIFromState();
            saveState();
        }

        function toggleTimer() {
            initAudio();
            const now = Date.now();

            if (appMode === 'timer') {
                if (timeLeft === 0 && !isTimerActive) return;

                if (isTimerActive) {
                    isTimerActive = false;
                    timerTarget = null;
                } else {
                    isTimerActive = true;
                    timerTarget = now + (timeLeft * 1000);
                }
            } else {
                if (stopwatchTime >= MAX_TIME_MS) return;

                if (isStopwatchActive) {
                    isStopwatchActive = false;
                    stopwatchTime = now - stopwatchStartTime;
                    stopwatchStartTime = null;
                } else {
                    isStopwatchActive = true;
                    stopwatchStartTime = now - stopwatchTime;
                }
            }

            if (isTimerActive || isStopwatchActive) {
                startIntervalLoop();
            }

            updateDisplay();
            saveState();
        }

        function resetTimer() {
            if (appMode === 'timer') {
                isTimerActive = false;
                timerTarget = null;
                timeLeft = initialTime;
            } else {
                isStopwatchActive = false;
                stopwatchStartTime = null;
                stopwatchTime = initialStopwatchTime;
            }

            if (!isTimerActive && !isStopwatchActive) {
                if (intervalId) clearInterval(intervalId);
            }

            playBtn.disabled = false;
            updateDisplay();
            saveState();
        }

        function goHome() {
            console.log("Navigating Home");
            location.href = "../index.html";
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function openEditMode() {
            if (appMode === 'timer' && isTimerActive) toggleTimer();
            if (appMode === 'stopwatch' && isStopwatchActive) toggleTimer();

            topBar.classList.add('hidden-force');
            controlsView.classList.add('hidden-force');
            editView.classList.remove('hidden-force');
            body.classList.add('edit-mode-active');

            if (fontSlider) fontSlider.value = currentFontSize;
            if (fontSizeDisplay) fontSizeDisplay.textContent = `${currentFontSize}px`;

            tabBtnTime.classList.remove('hidden-force');
            tabBtnTime.style.display = 'flex';
            tabBtnFont.classList.remove('hidden-force');
            tabBtnFont.style.display = 'flex';

            switchTab('time');

            let loadTime = appMode === 'timer' ? initialTime : Math.floor(initialStopwatchTime / 1000);
            let h = Math.floor(loadTime / 3600);
            let m = Math.floor((loadTime % 3600) / 60);
            let s = loadTime % 60;

            domHourInput.value = h > 0 ? h.toString().padStart(2, '0') : "";
            domMinInput.value = m.toString().padStart(2, '0');
            domSecInput.value = s.toString().padStart(2, '0');

            if (h > 0) {
                if (!showHoursInput) toggleHourInput();
            } else {
                if (showHoursInput) toggleHourInput();
            }

            updateInputColors();
            checkInputs();
            updatePreview();
        }

        function closeEditMode() {
            topBar.classList.remove('hidden-force');
            controlsView.classList.remove('hidden-force');
            editView.classList.add('hidden-force');
            body.classList.remove('edit-mode-active');
            updateDisplay();
        }

        function switchTab(mode) {
            currentEditMode = mode;
            const sectionTime = document.getElementById('section-time');
            const sectionFont = document.getElementById('section-font');
            const modalTitle = document.getElementById('modal-title');

            if (mode === 'time') {
                modalTitle.textContent = showHoursInput ? "設定小時" : "設定時間";
                sectionTime.classList.remove('hidden-force');
                sectionFont.classList.add('hidden-force');
                checkInputs();
            } else {
                modalTitle.textContent = "文字大小";
                sectionTime.classList.add('hidden-force');
                sectionFont.classList.remove('hidden-force');
                confirmBtn.disabled = false;
            }
        }

        function toggleHourInput() {
            showHoursInput = !showHoursInput;
            const hourGroup = document.getElementById('hour-group');
            const minSecGroup = document.getElementById('min-sec-group');
            const btn = document.getElementById('btn-toggle-hour');
            const hourIn = domHourInput;
            const modalTitle = document.getElementById('modal-title');

            if (showHoursInput) {
                hourGroup.classList.remove('hidden-force');
                hourGroup.classList.add('flex');
                minSecGroup.classList.add('hidden-force');
                btn.classList.add('active');

                modalTitle.textContent = "設定小時";
            } else {
                hourGroup.classList.add('hidden-force');
                hourGroup.classList.remove('flex');
                minSecGroup.classList.remove('hidden-force');
                btn.classList.remove('active');

                modalTitle.textContent = "設定時間";
            }
            updateInputColors();
            updatePreview();
        }

        function resetInputs() {
            domHourInput.value = "";
            domMinInput.value = "";
            domSecInput.value = "";

            updateInputColors();
            checkInputs();
            updatePreview();
        }

        function checkInputs() {
            if (currentEditMode === 'time') {
                const h = domHourInput.value;
                const m = domMinInput.value;
                const s = domSecInput.value;
                confirmBtn.disabled = !(m || s || h);
            } else {
                confirmBtn.disabled = false;
            }
        }

        function updateInputColors() {
            const styleInput = (el) => {
                if (el.value.length > 0) {
                    el.classList.remove('text-[#A3A3A3]', 'border-[#A3A3A3]/50');
                    el.classList.add('text-[#222222]', 'border-[#222222]');
                } else {
                    el.classList.add('text-[#A3A3A3]', 'border-[#A3A3A3]/50');
                    el.classList.remove('text-[#222222]', 'border-[#222222]');
                }
            };
            styleInput(domHourInput);
            styleInput(domMinInput);
            styleInput(domSecInput);

            if (domMinInput.value.length > 0 || domHourInput.value.length > 0) {
                timeColon.classList.remove('text-[#A3A3A3]');
                timeColon.classList.add('text-[#222222]');
            } else {
                timeColon.classList.add('text-[#A3A3A3]');
                timeColon.classList.remove('text-[#222222]');
            }
        }

        function updatePreview() {
            if (editView.classList.contains('hidden-force')) return;

            let h = domHourInput.value || "00";
            let m = domMinInput.value || "00";
            let s = domSecInput.value || "00";

            h = parseInt(h).toString().padStart(2, '0');
            m = parseInt(m).toString().padStart(2, '0');
            s = parseInt(s).toString().padStart(2, '0');

            let previewString = "";
            if (showHoursInput || parseInt(h) > 0) {
                previewString = `${h}:${m}:${s}`;
            } else {
                previewString = `${m}:${s}`;
            }

            timerDisplay.textContent = previewString;
            const requestedSize = parseInt(fontSlider.value);
            const safeSize = getSafeFontSize(requestedSize, previewString);

            timerDisplay.style.fontSize = `${safeSize}px`;
        }

        function useHistory(index) {
            quickSetTime(historyTimes[index] / 60);
        }

        function quickSetTime(minutes) {
            let h = 0, m = 0, s = 0;
            let totalSeconds = Math.round(minutes * 60);

            h = Math.floor(totalSeconds / 3600);
            m = Math.floor((totalSeconds % 3600) / 60);
            s = totalSeconds % 60;

            if (h > 0 && !showHoursInput) {
                toggleHourInput();
            }

            domHourInput.value = h > 0 ? h.toString().padStart(2, '0') : (showHoursInput ? "00" : "");
            domMinInput.value = m.toString().padStart(2, '0');
            domSecInput.value = s.toString().padStart(2, '0');

            updateInputColors();
            checkInputs();
            updatePreview();
        }

        function addToHistory(seconds) {
            if (historyTimes[0] === seconds) return;

            historyTimes.unshift(seconds);
            historyTimes = historyTimes.slice(0, 2);
            updateHistoryButtons();
        }

        function submitEdit(e) {
            if (e) e.preventDefault();

            if (currentEditMode === 'time') {
                let h = parseInt(domHourInput.value) || 0;
                let m = parseInt(domMinInput.value) || 0;
                let s = parseInt(domSecInput.value) || 0;

                if (s > 59) s = 59;

                if (m > 59) {
                    h += Math.floor(m / 60);
                    m = m % 60;
                }

                let totalSecs = (h * 3600) + (m * 60) + s;

                if (totalSecs > MAX_TIME_SECONDS) totalSecs = MAX_TIME_SECONDS;

                if (totalSecs >= 0) {
                    addToHistory(totalSecs);

                    if (appMode === 'timer') {
                        initialTime = totalSecs;
                        timeLeft = totalSecs;
                    } else {
                        initialStopwatchTime = totalSecs * 1000;
                        stopwatchTime = initialStopwatchTime;
                    }
                }
            }

            currentFontSize = parseInt(fontSlider.value);
            playBtn.disabled = false;
            updateDisplay();
            saveState();
            closeEditMode();
        }

        function handleInput(e) {
            let val = e.target.value;
            val = val.replace(/\D/g, '');
            if (val.length > 2) val = val.slice(-1);
            e.target.value = val;
            updateInputColors();
            checkInputs();
            updatePreview();
        }

        domHourInput.addEventListener('input', handleInput);
        domMinInput.addEventListener('input', handleInput);
        domSecInput.addEventListener('input', handleInput);

        fontSlider.addEventListener('input', (e) => {
            let requestedSize = parseInt(e.target.value);
            const currentString = timerDisplay.textContent;
            const safeSize = getSafeFontSize(requestedSize, currentString);
            fontSizeDisplay.textContent = `${requestedSize}px`;
            timerDisplay.style.fontSize = `${safeSize}px`;
        });

        editView.addEventListener('submit', submitEdit);

        document.addEventListener('fullscreenchange', () => {
            const iconMaximize = document.getElementById('icon-maximize');
            const iconMinimize = document.getElementById('icon-minimize');
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                iconMaximize.classList.add('hidden-force');
                iconMinimize.classList.remove('hidden-force');
                btn.title = "退出全螢幕";
            } else {
                iconMaximize.classList.remove('hidden-force');
                iconMinimize.classList.add('hidden-force');
                btn.title = "全螢幕 (Esc退出)";
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                toggleTimer();
            }
            if (e.code === 'Escape') {
                if (!editView.classList.contains('hidden-force')) {
                    closeEditMode();
                }
            }
        });

        window.addEventListener('load', () => {
            loadState();
            window.addEventListener('resize', updateDisplay);
        });

    </script>
</body>

</html>
