<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>條款 | 高林的個人網頁</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 使用 Noto Sans TC 和 Noto Serif TC 以符合新設計風格 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- 全局設定 --- */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #FDFCFB; /* 柔和的米白背景 */
            color: #5a4a3a; /* 主要文字顏色 */
            -webkit-font-smoothing: antialiased;
        }

        .font-serif {
            font-family: 'Noto Serif TC', serif;
        }

        /* --- 統一樣式 (來自新風格) --- */
        .section-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        .section-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 36px;
            font-weight: 700;
            color: #4b3f36;
            text-align: center;
            margin-bottom: 16px;
        }

        .section-subtitle {
            text-align: center;
            color: #9c8c7e;
            margin-bottom: 64px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            font-size: 1.1rem;
            line-height: 1.8;
        }
        
        /* --- 導覽列 (新風格) --- */
        .navbar {
            background: rgba(252, 248, 243, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid #EAE5DD;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        
        /* --- 卡片樣式 (新風格) --- */
        .custom-card {
            background-color: #FCF8F3;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            display: block;
            text-decoration: none;
            color: inherit;
            padding: 32px;
        }
        .custom-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.1);
        }
        
        .card-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: #4b3f36;
            margin-bottom: 1rem;
        }
        
        .card-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #6e5c4f;
        }
        
        /* --- 按鈕樣式 (新風格) --- */
        .primary-button {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 16px;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            background-color: #C1A88B;
            color: #FFFFFF;
        }
        .primary-button:hover {
            background-color: #B59A7B;
            box-shadow: 0 4px 20px rgba(193, 168, 139, 0.4);
        }
    </style>
</head>

<body>
    <!-- 頁首導覽列 -->
    <header class="navbar">
        <nav class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <!-- 您的網站名稱 -->
            <a href="#" class="text-xl font-serif font-bold text-[#4b3f36]">高林的個人網頁</a>
            <!-- 返回首頁按鈕 -->
            <a href="#" class="primary-button !py-2 !px-5 !text-sm">返回首頁</a>
        </nav>
    </header>

    <main>
        <section class="section-container">
            <!-- 頁面標題 -->
            <h1 class="section-title">條款與政策</h1>
            <!-- 頁面副標題 -->
            <p class="section-subtitle">為了保障您的權益並提供更好的服務，請在使用本網站前詳細閱讀以下內容。</p>
            
            <div class="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                
                <!-- 隱私條款卡片 -->
                <!-- 注意：這裡的 href 指向了 '#'，請替換成您實際的頁面路徑 -->
                <a href="#" class="custom-card">
                    <h2 class="card-title">隱私條款</h2>
                    <p class="card-text">我們重視您的個人資料保護，所有資訊僅用於提升使用體驗，不會任意分享給第三方。</p>
                </a>
                
                <!-- 服務條款卡片 -->
                <!-- 注意：這裡的 href 指向了 '#'，請替換成您實際的頁面路徑 -->
                <a href="#" class="custom-card">
                    <h2 class="card-title">服務條款</h2>
                    <p class="card-text">使用本網站即表示您同意遵守相關規範，包括但不限於內容使用、互動行為與資料安全。</p>
                </a>
            </div>
            
            <!-- 返回首頁的按鈕 (在頁尾導覽列已提供，此處為備用) -->
            <div class="text-center mt-16">
                 <a href="#" class="primary-button">返回首頁</a>
            </div>
        </section>
    </main>

    <!-- 頁尾 -->
    <footer class="bg-[#FCF8F3] border-t border-[#EAE5DD]">
        <div class="max-w-6xl mx-auto px-6 py-8 text-center">
             <p class="text-sm text-[#9c8c7e]">&copy; 2025 高林的個人網頁. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
