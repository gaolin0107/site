<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="計時器">
    <title>計時器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .hidden-force {
            display: none !important;
        }

        input:focus {
            outline: none;
        }

        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --muted-color: #666666;
            --editor-bg: #FEFAEF;
            --editor-text: #1C1917;
            --accent-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Noto Sans', system-ui, -apple-system, sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .ui-fade {
            transition: opacity 1.5s ease-in-out, visibility 1.5s ease-in-out;
        }
        
        .ui-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        button {
            background: transparent;
            border: none;
            box-shadow: none;
            color: inherit;
            transition: all 0.2s ease;
            cursor: pointer;
            padding: 8px;
        }

        button:hover {
            opacity: 0.7;
            transform: scale(1.1);
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.2 !important;
            cursor: not-allowed;
            transform: none !important;
        }

        .mode-viewport {
            overflow: hidden;
            position: relative;
            transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            border-radius: 9999px;
        }

        .mode-switch-container {
            display: flex;
            align-items: center;
            gap: 4px;
            position: relative;
            transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }

        #nav-active-pill {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 56px;
            border-radius: 9999px;
            background-color: var(--accent-color);
            transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), width 0.42s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.3s ease;
            z-index: 0;
            pointer-events: none;
        }

        .mode-btn {
            position: relative;
            z-index: 1;
            width: 56px;
            flex-shrink: 0;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            color: inherit;
            opacity: 0.5;
            transition: color 0.3s ease, opacity 0.3s ease, transform 0.2s ease;
            padding: 4px 0;
            border-radius: 9999px;
            white-space: nowrap;
        }

        .mode-btn:hover {
            opacity: 0.85;
            transform: scale(1.05);
        }

        .mode-btn.active {
            opacity: 1;
            font-weight: 700;
            color: var(--editor-bg);
        }

        .setting-pill-btn {
            border: 2px solid transparent;
            padding: 6px 16px;
            border-radius: 9999px;
            transition: all 0.3s;
            font-size: 14px;
            color: var(--editor-text);
            opacity: 0.6;
        }

        .setting-pill-btn:hover {
            opacity: 1;
        }

        .setting-pill-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            opacity: 1;
            font-weight: 700;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            margin-top: -10px;
            transition: background-color 0.3s ease;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #E5E5E5;
            border-radius: 2px;
        }

        input[type=range]:focus {
            outline: none;
        }

        #timer-container {
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .edit-mode-active #timer-container {
            transform: translateY(-26vh) !important;
        }

        .ios-dot {
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background-color: #D1D1D1;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .ios-dot.active {
            width: 18px;
            background-color: var(--accent-color);
        }

        #edit-view, #pomodoro-view {
            transition: height 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.4s cubic-bezier(0.34, 1.3, 0.64, 1), background-color 0.3s ease, color 0.3s ease;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.25);
        }

        .pomo-icon-btn {
            border: 1px solid transparent;
            padding: 8px;
            border-radius: 9999px;
            transition: all 0.3s;
            opacity: 0.6;
        }

        .pomo-icon-btn:hover {
            opacity: 1;
            background-color: rgba(128, 128, 128, 0.15);
        }

        .pomo-icon-btn.active {
            opacity: 1;
            background-color: rgba(128, 128, 128, 0.25);
            border-color: currentColor;
        }

        .help-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            background-color: rgba(128, 128, 128, 0.12);
        }

        .help-item-card {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            text-align: left;
            padding: 10px 12px;
            border-radius: 14px;
            background-color: rgba(128, 128, 128, 0.08);
            width: 100%;
        }

        @keyframes modeSlideFromRight {
            0% {
                opacity: 0;
                transform: translateX(38px) scale(0.96);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
                filter: blur(0px);
            }
        }

        @keyframes modeSlideFromLeft {
            0% {
                opacity: 0;
                transform: translateX(-38px) scale(0.96);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
                filter: blur(0px);
            }
        }

        .mode-anim-next {
            animation: modeSlideFromRight 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .mode-anim-prev {
            animation: modeSlideFromLeft 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .ctrl-btn-collapse {
            opacity: 0 !important;
            transform: scale(0.5) !important;
            width: 0 !important;
            margin-left: -20px !important;
            margin-right: -20px !important;
            border-width: 0 !important;
            padding: 0 !important;
            pointer-events: none !important;
            overflow: hidden !important;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center relative selection:bg-gray-700 overflow-hidden">

    <video id="invisible-video" loop muted playsinline class="hidden-force" src="data:video/mp4;base64,AAAAHGZ0eXBtcDQyAAAAAG1wNDJpc29tAAAAZmZyZWUAAAAidmRhdAAAAAAAAAAAAAAAAdgAc2gAdgAAdgBzaAB2AAAAbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAAAQAArgAAAAEAAAEAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAAAGGlvbmYAAAAUcHJ2cwAAAAAAdmRhdAAAAAA="></video>
    <canvas id="pip-canvas" width="520" height="280" class="hidden-force"></canvas>
    <video id="pip-video" muted playsinline class="hidden-force"></video>

    <div id="pause-layer" class="fixed inset-0 z-10 hidden-force" onclick="pauseCurrentTimer()"></div>

    <div id="top-bar" class="ui-fade fixed top-6 left-1/2 -translate-x-1/2 flex items-center gap-2 sm:gap-3 px-4 py-2 rounded-full z-40 transition-all duration-1000 shadow-lg border border-current/10" style="background-color: var(--editor-bg); color: var(--editor-text);">
        <button onclick="showHelpModal()" title="使用手冊" class="opacity-60 hover:opacity-100 transition-opacity p-1.5">
            <i data-lucide="help-circle" width="18" height="18"></i>
        </button>

        <div class="h-4 w-[1px] bg-current opacity-20"></div>

        <div class="flex items-center gap-1">
            <button onclick="cycleMode(-1)" id="nav-prev-btn" title="上一個模式" class="opacity-60 hover:opacity-100 transition-opacity p-1">
                <i data-lucide="chevron-left" width="18" height="18"></i>
            </button>

            <div id="mode-viewport" class="mode-viewport">
                <div id="mode-switch-list" class="mode-switch-container">
                    <div id="nav-active-pill"></div>
                    <button onclick="switchAppMode('timer')" id="btn-mode-timer" class="mode-btn active">計時</button>
                    <button onclick="switchAppMode('stopwatch')" id="btn-mode-stopwatch" class="mode-btn">碼錶</button>
                    <button onclick="switchAppMode('pomo')" id="btn-mode-pomo" class="mode-btn">番茄</button>
                    <button onclick="switchAppMode('clock')" id="btn-mode-clock" class="mode-btn">時鐘</button>
                </div>
            </div>

            <button onclick="cycleMode(1)" id="nav-next-btn" title="下一個模式" class="opacity-60 hover:opacity-100 transition-opacity p-1">
                <i data-lucide="chevron-right" width="18" height="18"></i>
            </button>
        </div>

        <div class="h-4 w-[1px] bg-current opacity-20"></div>

        <div class="flex items-center gap-0.5">
            <button onclick="togglePiP()" id="pip-btn" title="子母畫面懸浮窗" class="opacity-60 hover:opacity-100 transition-opacity p-1.5">
                <i data-lucide="picture-in-picture-2" width="18" height="18"></i>
            </button>
            <button onclick="toggleFullscreen()" id="fullscreen-btn" title="全螢幕" class="opacity-60 hover:opacity-100 transition-opacity p-1.5">
                <i data-lucide="maximize" width="18" height="18" id="icon-maximize"></i>
                <i data-lucide="minimize" width="18" height="18" id="icon-minimize" class="hidden-force"></i>
            </button>
        </div>
    </div>

    <div class="flex flex-col items-center justify-center w-full h-screen px-4 z-0 absolute top-0 left-0 pointer-events-none select-none" style="user-select: none; -webkit-user-select: none;">
        <div id="timer-container" class="relative flex flex-col items-center justify-center pointer-events-auto w-full">
            
            <div id="timer-pomo-dots" class="flex justify-center items-center gap-2.5 mb-6 hidden-force">
            </div>

            <div id="timer-status" class="ui-fade absolute bottom-full mb-4 left-1/2 -translate-x-1/2 text-sm font-medium tracking-widest uppercase opacity-0 whitespace-nowrap min-h-[20px]">
            </div>
            
            <h1 id="timer-display" class="tracking-wide leading-none tabular-nums whitespace-nowrap text-center" style="font-family: 'Noto Sans', sans-serif; font-weight: 700;">
                Loading...
            </h1>
            
        </div>
    </div>

    <div id="controls-view" class="ui-fade fixed bottom-[80px] left-0 w-full flex justify-center items-center gap-10 z-20 animate-in fade-in duration-1000">
        <button id="reset-btn" onclick="resetTimer()" title="重置" class="w-14 h-14 rounded-full border border-current opacity-40 hover:opacity-100 flex items-center justify-center transition-all duration-300">
            <i data-lucide="rotate-ccw" width="22" height="22"></i>
        </button>

        <button id="play-pause-btn" onclick="toggleTimer()" title="開始/暫停 (Space)" class="w-20 h-20 rounded-full border-[2.5px] flex items-center justify-center transition-all duration-300 shadow-xl" style="border-color: var(--accent-color); color: var(--accent-color);">
            <span id="play-icon-wrapper" class="flex items-center justify-center">
                <i data-lucide="play" width="32" height="32" class="fill-current"></i>
            </span>
            <span id="pause-icon-wrapper" class="hidden-force flex items-center justify-center">
                <i data-lucide="pause" width="32" height="32" class="fill-current"></i>
            </span>
        </button>

        <button id="edit-btn" onclick="openEditMode()" title="設定" class="w-14 h-14 rounded-full border border-current opacity-40 hover:opacity-100 flex items-center justify-center transition-all duration-300">
            <i data-lucide="pencil" width="22" height="22"></i>
        </button>
    </div>

    <form id="edit-view" class="translate-y-full pointer-events-none fixed bottom-0 left-0 w-full h-[310px] z-50 px-6 pt-5 pb-6 flex flex-col items-center justify-between gap-2 rounded-t-[2rem]" style="background-color: var(--editor-bg); color: var(--editor-text);">

        <div class="w-full flex items-center justify-between relative min-h-[36px]">
            <div class="flex items-center gap-3 z-10">
                <div id="edit-tabs" class="flex items-center gap-3">
                    <button type="button" id="tab-btn-time" onclick="switchTab('time')" class="opacity-100 p-1.5 flex items-center justify-center">
                        <i data-lucide="clock" width="22" height="22"></i>
                    </button>
                    <button type="button" id="tab-btn-font" onclick="switchTab('font')" class="opacity-100 p-1.5 flex items-center justify-center">
                        <i data-lucide="type" width="22" height="22"></i>
                    </button>
                    <button type="button" id="tab-btn-more" onclick="switchTab('more')" class="opacity-100 p-1.5 flex items-center justify-center">
                        <i data-lucide="sliders" width="22" height="22"></i>
                    </button>
                </div>
                <div id="custom-theme-btns" class="hidden-force flex items-center gap-3">
                    <button type="button" onclick="exitCustomThemeSave()" class="flex items-center gap-1 font-bold text-xs py-1.5 px-2">
                        <i data-lucide="arrow-left" width="16" height="16"></i> 返回
                    </button>
                    <button type="button" onclick="exitCustomThemeCancel()" class="flex items-center gap-1 text-xs opacity-60 py-1.5 px-2">
                        <i data-lucide="x" width="14" height="14"></i> 取消
                    </button>
                </div>
            </div>

            <h3 id="modal-title" class="text-lg font-bold tracking-wide text-center absolute left-1/2 -translate-x-1/2 pointer-events-none opacity-60 transition-opacity duration-300 whitespace-nowrap leading-none">設定時間</h3>

            <div class="flex items-center gap-3 z-10">
                <button type="button" onclick="cancelEditMode()" class="p-1.5 flex items-center justify-center">
                    <i data-lucide="x" width="24" height="24"></i>
                </button>
                <button type="submit" id="confirm-btn" class="p-1.5 flex items-center justify-center">
                    <i data-lucide="check" width="24" height="24"></i>
                </button>
            </div>
        </div>

        <div class="flex-1 w-full flex flex-col items-center justify-center mb-1">

            <div id="section-time" class="flex flex-col items-center gap-4 w-full transition-opacity duration-300">
                <div id="time-inputs-container" class="flex items-center justify-center gap-2 md:gap-4 text-7xl font-bold transition-all duration-300">
                    
                    <div id="hour-group" class="hidden-force flex items-center gap-2 md:gap-4">
                        <div class="relative group">
                            <input id="hour-input" type="text" inputmode="numeric" placeholder="00"
                                class="w-32 bg-transparent border-b-[4px] border-neutral-400 focus:border-current outline-none text-center pb-2 transition-colors text-current" />
                        </div>
                    </div>

                    <div id="min-sec-group" class="flex items-center gap-2 md:gap-4">
                        <div class="relative group">
                            <input id="min-input" type="text" inputmode="numeric" placeholder="00"
                                class="w-32 bg-transparent border-b-[4px] border-neutral-400 focus:border-current outline-none text-center pb-2 transition-colors text-current" />
                        </div>
                        <span id="time-colon" class="pb-4 transition-colors text-current">:</span>
                        <div class="relative group">
                            <input id="sec-input" type="text" inputmode="numeric" placeholder="00"
                                class="w-32 bg-transparent border-b-[4px] border-neutral-400 focus:border-current outline-none text-center pb-2 transition-colors text-current" />
                        </div>
                    </div>
                </div>

                <div class="flex flex-wrap justify-center gap-4 w-full px-4 mt-auto">
                    <button type="button" id="btn-format-toggle" onclick="toggleFormat()" class="setting-pill-btn font-bold active">二位</button>
                    <button type="button" id="btn-reset-inputs" onclick="resetInputs()" class="setting-pill-btn font-bold active">歸零</button>
                    <button type="button" id="btn-toggle-hour" onclick="toggleHourInput()" class="setting-pill-btn font-bold active">小時</button>
                </div>
            </div>

            <div id="section-font" class="hidden-force flex flex-col items-center justify-center gap-4 w-full px-8 transition-opacity duration-300">
                <div class="w-full relative py-2 max-w-xs mt-2">
                    <input type="range" id="font-slider" min="20" max="600" value="160" step="5" class="w-full">
                </div>
                
                <div class="flex gap-4 justify-center mt-2">
                    <button type="button" id="btn-toggle-family" onclick="toggleFontFamily()" class="setting-pill-btn active">無襯</button>
                    <button type="button" id="btn-toggle-weight" onclick="toggleFontWeight()" class="setting-pill-btn active">粗體</button>
                    <button type="button" id="btn-toggle-layou
